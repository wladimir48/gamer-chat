<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat v51.3.2 PRO — Final Final</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --bg-servers: #1e1f22; --accent: #5865f2; --green: #23a559; --text: #dbdee1; }
        body { background: var(--bg-servers); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .col-channels { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        .col-chat { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; border-left: 1px solid #222; min-width: 0; }
        .v-u-card { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin: 5px 10px; border: 2px solid transparent; transition: 0.2s; }
        .speaking { border-color: var(--green) !important; box-shadow: 0 0 12px var(--green); transform: scale(1.02); }
        .vol-bar { width: 100%; height: 8px; background: #111; border-radius: 4px; margin-top: 5px; overflow: hidden; }
        .vol-fill { width: 0%; height: 100%; background: var(--green); transition: 0.05s; }
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; display: none; align-items: center; justify-content: center; }
        .m-content { background: var(--bg-main); padding: 25px; border-radius: 12px; width: 320px; display: flex; flex-direction: column; gap: 15px; }
        #mic-test-bar { height: 12px; background: var(--green); width: 0%; border-radius: 6px; transition: 0.04s; max-width: 100%; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; text-transform: uppercase; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; }
        .ui-input { width: 100%; padding: 12px; background: #383a40; color: white; border: none; border-radius: 8px; box-sizing: border-box; outline: none; }
    </style>
</head>
<body onclick="window.initAudio()">

<div id="modal">
    <div class="m-content">
        <h3 style="margin:0; text-align:center">⚙️ ГЕЙМЕР-НАСТРОЙКИ</h3>
        <input type="text" id="set-nick" placeholder="Никнейм" class="ui-input">
        <label style="font-size: 11px;">ИНДИКАТОР MIC (EXTREME X450):</label>
        <div style="background:#111; height:12px; border-radius:6px; overflow:hidden;"><div id="mic-test-bar"></div></div>
        <select id="mic-list" class="ui-input"></select>
        <button class="btn" onclick="window.saveSettings()">СОХРАНИТЬ</button>
        <button class="btn" style="background:#4f545c" onclick="window.closeSettings()">ЗАКРЫТЬ</button>
    </div>
</div>

<div class="col-channels">
    <div style="padding:15px; font-weight:bold; border-bottom:1px solid #222; font-size:14px">🔊 GamerChat v51.3.2</div>
    <div id="v-users" style="flex:1; overflow-y:auto; padding-top:10px;"></div>
    <div style="padding:10px"><button id="btn-toggle" class="btn" onclick="window.joinVoice()">ВОЙТИ В ЭФИР</button></div>
    <div style="padding:15px; background:#232428; display:flex; justify-content:space-between; align-items:center">
        <span id="display-nick" style="font-weight:bold">...</span>
        <span onclick="window.openSettings()" style="cursor:pointer; font-size:20px">⚙️</span>
    </div>
</div>

<div class="col-chat">
    <div id="msgs"></div>
    <div style="padding:20px"><input type="text" id="ui" class="ui-input" placeholder="Написать сообщение..."></div>
</div>

<script>
    "use strict";
    let myName = localStorage.getItem('chat_nick') || "PLAYER_" + Math.floor(Math.random()*999);
    let selectedMic = localStorage.getItem('chat_mic') || 'default';
    let gCtx = null, myStream = null, testStream = null, peer = null, db = null;

    const cfg = {
        apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
        databaseURL: "https://gamerchat-7a857-default-rtdb.firebaseio.com"
    };

    window.initAudio = function() {
        if (!gCtx) gCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (gCtx.state === 'suspended') gCtx.resume();
    };

    window.onload = () => {
        if (typeof firebase === 'undefined') return;
        if (!firebase.apps.length) firebase.initializeApp(cfg);
        db = firebase.database();
        document.getElementById('display-nick').innerText = myName;

        peer = new Peer(myName.toLowerCase(), {
            host: '0.peerjs.com',
            port: 443, secure: true, path: '/'
        });

        peer.on('call', (call) => {
            window.initAudio();
            call.answer(myStream);
            call.on('stream', (rem) => { renderCard(call.peer); visualize(rem, call.peer, true); });
        });

        db.ref('global_chat').limitToLast(30).on('child_added', s => {
            const d = s.val();
            const id = 'msg-' + s.key;
            if(d && !document.getElementById(id)) {
                document.getElementById('msgs').insertAdjacentHTML('beforeend', `<div id="${id}"><b>${d.u}:</b> ${d.t}</div>`);
                document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
            }
        });

        db.ref('voice_v12').on('value', s => {
            const data = s.val() || {};
            const container = document.getElementById('v-users');
            container.querySelectorAll('.v-u-card').forEach(card => {
                const uid = card.id.replace('card-', '');
                if (!data[uid]) {
                    const audio = document.getElementById('audio-' + uid);
                    if(audio) audio.remove();
                    card.remove();
                }
            });
            for(let user in data) renderCard(user);
        });

        const ui = document.getElementById('ui');
        ui.onkeydown = (e) => { if(e.key === 'Enter' && ui.value.trim()){ db.ref('global_chat').push({u:myName, t:ui.value}); ui.value=""; } };
    };

    window.joinVoice = async function() {
        window.initAudio();
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: selectedMic === 'default' ? undefined : { exact: selectedMic }, echoCancellation: true, noiseSuppression: true } });
            document.getElementById('btn-toggle').innerText = "В ЭФИРЕ";
            document.getElementById('btn-toggle').style.background = "var(--green)";
            const myId = myName.toLowerCase();
            const userRef = db.ref('voice_v12').child(myId);
            userRef.set({status: 'online'});
            userRef.onDisconnect().remove();
            renderCard(myId); visualize(myStream, myId, false);
            db.ref('voice_v12').once('value', (s) => {
                const users = s.val();
                for(let target in users) { if(target !== myId) { const call = peer.call(target, myStream); call.on('stream', (rem) => { renderCard(target); visualize(rem, target, true); }); } }
            });
        } catch (e) { console.error("Mic error:", e); }
    };

    function renderCard(n) {
        const id = 'card-' + n.toLowerCase();
        if (document.getElementById(id)) return;
        document.getElementById('v-users').insertAdjacentHTML('beforeend', `<div class="v-u-card" id="${id}"><div>${n.toUpperCase()}</div><div class="vol-bar"><div class="vol-fill" id="vol-${n.toLowerCase()}"></div></div></div>`);
    }

    function visualize(stream, n, isRemote) {
        if (!gCtx) return;
        const nid = n.toLowerCase();
        if (isRemote) {
            let audio = document.getElementById('audio-' + nid) || document.createElement('audio');
            audio.id = 'audio-' + nid; audio.autoplay = true; audio.srcObject = stream;
            document.body.appendChild(audio);
        }
        const src = gCtx.createMediaStreamSource(stream);
        const anz = gCtx.createAnalyser(); src.connect(anz);
        const dat = new Uint8Array(anz.frequencyBinCount);
        function loop() {
            const bar = document.getElementById('vol-' + nid);
            const card = document.getElementById('card-' + nid);
            if(!bar) return;
            anz.getByteFrequencyData(dat);
            let v = (Math.max(...dat) / 255);
            bar.style.width = Math.min(100, v * 100 * 5) + "%";
            if(card) card.classList.toggle('speaking', v > 0.06);
            requestAnimationFrame(loop);
        } loop();
    }

    window.openSettings = async function() {
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('set-nick').value = myName;
        const devs = await navigator.mediaDevices.enumerateDevices();
        const list = document.getElementById('mic-list'); list.innerHTML = "";
        devs.forEach(d => { if(d.kind==='audioinput') { const opt = document.createElement('option'); opt.value = d.deviceId; opt.text = d.label || 'Microphone'; if(d.deviceId === selectedMic) opt.selected = true; list.appendChild(opt); } });
        startMicTest(selectedMic);
    };

    async function startMicTest(id) {
        if(testStream) testStream.getTracks().forEach(t=>t.stop());
        try {
            testStream = await navigator.mediaDevices.getUserMedia({audio: {deviceId: id==='default'?undefined:{exact:id}}});
            const tAnz = gCtx.createAnalyser(); gCtx.createMediaStreamSource(testStream).connect(tAnz);
            const tDat = new Uint8Array(tAnz.frequencyBinCount);
            function loop() {
                if (document.getElementById('modal').style.display === 'none') return;
                tAnz.getByteFrequencyData(tDat);
                let v = (Math.max(...tDat) / 255) * 450;
                document.getElementById('mic-test-bar').style.width = Math.min(100, v) + "%";
                requestAnimationFrame(loop);
            } loop();
        } catch(e) {}
    }

    window.saveSettings = () => { localStorage.setItem('chat_nick', document.getElementById('set-nick').value); localStorage.setItem('chat_mic', document.getElementById('mic-list').value); location.reload(); };
    window.closeSettings = () => { document.getElementById('modal').style.display = 'none'; if(testStream) testStream.getTracks().forEach(t=>t.stop()); };
</script>
</body>
</html>
