<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat PRO — ONE LINK</title>
    <!-- БИБЛИОТЕКА ИЗ ОБЛАКА -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --bg-servers: #1e1f22; --accent: #5865f2; --green: #23a559; --red: #ed4245; --text: #dbdee1; }
        body { background: var(--bg-servers); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .col-channels { width: 240px; background: var(--bg-sidebar); border-right: 1px solid #111; display: flex; flex-direction: column; }
        .col-chat { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; }
        .col-users { width: 230px; background: var(--bg-sidebar); border-left: 1px solid #111; padding: 15px; }
        .my-profile { padding: 15px; background: #232428; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: center; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
        .u-ava { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; }
        .mic-mini-bar { width: 32px; height: 4px; background: #111; border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .mic-mini-fill { height: 100%; width: 0%; background: var(--green); transition: 0.03s; }
        .input-area { padding: 15px 20px; background: var(--bg-main); border-top: 1px solid rgba(255,255,255,0.05); }
        #ui { width: 100%; padding: 12px; background: #383a40; border: none; border-radius: 8px; color: white; outline: none; }
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .m-box { background: var(--bg-main); padding: 30px; border-radius: 12px; text-align: center; width: 320px; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

<!-- ЗАСТАВКА ДЛЯ АКТИВАЦИИ ЗВУКА И ПРОБИВА ТУННЕЛЯ -->
<div id="modal">
    <div class="m-box">
        <h2 style="margin:0 0 10px 0">GamerChat</h2>
        <p style="font-size:13px; color:#949ba4">Нажми кнопку ниже, чтобы войти в чат и активировать голос.</p>
        <button class="btn" id="start-btn" onclick="startApp()">ВОЙТИ В ЭФИР</button>
    </div>
</div>

<div class="col-channels">
    <div class="my-profile">
        <div style="display:flex; align-items:center; gap:10px">
            <img id="my-ava-img" class="u-ava" src="https://api.dicebear.com/7.x/pixel-art/svg?seed=77">
            <b id="my-nick" style="font-size:14px">...</b>
        </div>
        <span onclick="location.reload()" style="cursor:pointer; font-size:18px">⚙️</span>
    </div>
    <div style="flex:1; padding:15px">
        <div id="v-btn" onclick="toggleVoice()" style="cursor:pointer; color:#949ba4; font-weight:bold; margin-bottom:15px">🔈 ВОЙТИ В КАНАЛ</div>
        <div id="v-list"></div>
    </div>
</div>

<div class="col-chat">
    <div id="msgs"></div>
    <div class="input-area"><input type="text" id="ui" placeholder="Написать сообщение..." autocomplete="off"></div>
</div>

<div class="col-users">
    <div style="color: #949ba4; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px;" id="u-count">В СЕТИ — 0</div>
    <div id="u-list-online"></div>
</div>

<script>
    "use strict";
    const serverUrl = 'https://92ftbdnzwp.localto.net';
    let socket = null, peer = null, myStream = null, isInVoice = false;
    let gCtx = new (window.AudioContext || window.webkitAudioContext)();
    let myName = localStorage.getItem('chat_nick') || "Вован";
    let mySens = 10;

    document.getElementById('my-nick').innerText = myName;

    // СУПЕР-СКРИПТ: ПРОБИВАЕМ ТУННЕЛЬ ПЕРЕД ПОДКЛЮЧЕНИЕМ
    async function startApp() {
        const btn = document.getElementById('start-btn');
        btn.innerText = "Подключение...";
        
        try {
            // "Стучимся" в туннель. Это заменит нажатие кнопки Visit Site
            await fetch(serverUrl, { mode: 'no-cors' });
            
            // Теперь подключаем сокеты
            socket = io(serverUrl, { transports: ['polling', 'websocket'], secure: true });
            
            setupSocket();
            setupPeer();
            
            document.getElementById('modal').style.display = 'none';
            if (gCtx.state === 'suspended') gCtx.resume();
        } catch (e) {
            alert("Сервер не отвечает! Убедись, что Node.js и Localtonet запущены.");
        }
    }

    function setupSocket() {
        socket.on('connect', () => socket.emit('user join', { name: myName, inVoice: false }));
        
        socket.on('chat message', d => {
            document.getElementById('msgs').insertAdjacentHTML('beforeend', `<div><b>${d.u}:</b> ${d.t}</div>`);
            document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
        });

        socket.on('update users', users => {
            const vL = document.getElementById('v-list'), uL = document.getElementById('u-list-online');
            vL.innerHTML = ""; uL.innerHTML = ""; let count = 0;
            for(let id in users) {
                count++;
                uL.insertAdjacentHTML('beforeend', `<div style="margin-bottom:10px">● ${users[id].name}</div>`);
                if(users[id].inVoice) {
                    vL.insertAdjacentHTML('beforeend', `
                        <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px">
                            <div style="display:flex; flex-direction:column; align-items:center">
                                <img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=${users[id].name}" style="width:32px; border-radius:50%">
                                <div class="mic-mini-bar"><div class="mic-mini-fill" id="mic-v-${id}"></div></div>
                            </div>
                            <span style="font-size:13px">${users[id].name}</span>
                        </div>`);
                }
            }
            document.getElementById('u-count').innerText = `В СЕТИ — ${count}`;
        });
    }

    function setupPeer() {
        peer = new Peer(myName.toLowerCase().replace(/[^a-z]/g,''), { host: '0.peerjs.com', port: 443, secure: true, path: '/' });
        peer.on('call', call => {
            call.answer(myStream);
            call.on('stream', rem => {
                const a = document.createElement('audio'); a.srcObject = rem; a.autoplay = true; document.body.appendChild(a);
            });
        });
    }

    async function toggleVoice() {
        if (!isInVoice) {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            isInVoice = true; document.getElementById('v-btn').style.color = 'var(--green)';
            socket.emit('user join', { name: myName, inVoice: true });
            
            const src = gCtx.createMediaStreamSource(myStream), anz = gCtx.createAnalyser();
            src.connect(anz); const dat = new Uint8Array(anz.frequencyBinCount);
            function loop() {
                if(!isInVoice) return;
                anz.getByteFrequencyData(dat);
                let vol = (Math.max(...dat)/255)*100;
                const fill = document.getElementById('mic-v-' + socket.id);
                if(fill) fill.style.width = vol + "%";
                requestAnimationFrame(loop);
            } loop();
        } else { location.reload(); }
    }

    const ui = document.getElementById('ui');
    ui.onkeydown = (e) => { if(e.key === 'Enter' && ui.value.trim()){ socket.emit('chat message', { u: myName, t: ui.value }); ui.value = ""; } };
</script>
</body>
</html>
