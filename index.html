<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerChat - v4.0 Embedded Voice</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #1e1f22; color: #dbdee1; font-family: sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .servers { width: 72px; background-color: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 12px; border-right: 1px solid #2b2d31; z-index: 10; }
        .icon { width: 48px; height: 48px; background-color: #5865f2; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 8px; }
        .icon:hover { border-radius: 30%; background-color: #4752c4; }
        .icon.voice { background-color: #23a559; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #313338; position: relative; }
        #st { text-align: center; color: #23a559; padding: 5px; font-size: 0.75rem; font-weight: bold; background: #2b2d31; }
        #msgs { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        
        .msg { margin-bottom: 16px; background: rgba(79, 84, 92, 0.16); padding: 12px; border-radius: 8px; border-left: 4px solid #5865f2; }
        .author { color: #fff; font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .author small { color: #949ba4; font-size: 0.7em; margin-left: 8px; font-weight: normal; }
        .del-btn { color: #f23f43; cursor: pointer; font-weight: bold; }
        
        .chat-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 8px; display: block; }

        .input-box { padding: 20px; }
        input { width: 100%; background: #383a40; border: none; border-radius: 8px; padding: 14px; color: white; outline: none; box-sizing: border-box; }

        /* Окно голосового чата внутри страницы */
        #voice-window {
            position: absolute; top: 40px; right: 20px; width: 350px; height: 500px;
            background: #1e1f22; border: 2px solid #23a559; border-radius: 12px;
            display: none; flex-direction: column; overflow: hidden; z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #voice-window iframe { border: none; width: 100%; height: 100%; }
        .close-voice { background: #f23f43; color: white; text-align: center; cursor: pointer; padding: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="servers">
        <div class="icon" onclick="location.reload()">G</div>
        <div class="icon voice" onclick="toggleVoice()" title="Голосовой канал">🎤</div>
    </div>

    <div class="chat-area">
        <div id="st">ПОДКЛЮЧЕНИЕ...</div>
        
        <!-- Встроенное окно голоса -->
        <div id="voice-window">
            <div class="close-voice" onclick="toggleVoice()">ЗАКРЫТЬ ГОЛОС ×</div>
            <iframe id="v-frame" allow="microphone; camera"></iframe>
        </div>

        <div id="msgs"></div>
        <div class="input-box">
            <input type="text" id="ui" placeholder="Напиши что-нибудь или кинь ссылку на картинку...">
        </div>
    </div>

<script>
    const cfg = {
        apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
        authDomain: "gamerchat-7a857.firebaseapp.com",
        databaseURL: "https://gamerchat-7a857-default-rtdb.firebaseio.com",
        projectId: "gamerchat-7a857",
        storageBucket: "gamerchat-7a857.firebasestorage.app",
        messagingSenderId: "899769524812",
        appId: "1:899769524812:web:87609f2f41e3ab93084ae9"
    };

    const notifySound = new Audio('https://githubusercontent.com');

    // Функция переключения встроенного голоса
    function toggleVoice() {
        const win = document.getElementById('voice-window');
        const frame = document.getElementById('v-frame');
        if (win.style.display === 'flex') {
            win.style.display = 'none';
            frame.src = ""; // Остановить голос при закрытии
        } else {
            win.style.display = 'flex';
            // Используем прямой путь к комнате
            frame.src = "https://jit.si";
        }
    }

    firebase.initializeApp(cfg);
    const db = firebase.database();
    let myName = localStorage.getItem('chat_nick') || prompt("Твой ник:", "Геймер") || "Аноним";
    localStorage.setItem('chat_nick', myName);

    db.ref('.info/connected').on('value', s => {
        document.getElementById('st').innerText = s.val() ? "В СЕТИ" : "ПОДКЛЮЧЕНИЕ...";
        document.getElementById('st').style.color = s.val() ? "#23a559" : "#f23f43";
    });

    document.getElementById('ui').onkeypress = function(e) {
        if (e.key === 'Enter' && this.value.trim() !== "") {
            db.ref('global_chat').push().set({ 
                u: myName, t: this.value,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
            });
            this.value = "";
        }
    };

    db.ref('global_chat').limitToLast(50).on('child_added', s => {
        const d = s.val();
        const key = s.key;
        const m = document.createElement('div');
        m.className = 'msg';
        m.id = 'msg-' + key;

        let content = d.t;
        const imgRegex = /(http(s?):)([/|.|\w|\s|-])*\.(?:jpg|gif|png|webp|jpeg)/i;
        if (imgRegex.test(d.t)) {
            content = `${d.t}<br><img src="${d.t}" class="chat-img" onerror="this.style.display='none'">`;
        }

        let delBtn = (d.u === myName || myName === "CREATIV") ? `<span class="del-btn" onclick="deleteMsg('${key}')">×</span>` : "";

        m.innerHTML = `<div class="author"><span>${d.u} <small>${d.time || ''}</small></span>${delBtn}</div><div>${content}</div>`;
        document.getElementById('msgs').appendChild(m);
        document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
        if (d.u !== myName) notifySound.play().catch(() => {});
    });

    window.deleteMsg = function(key) {
        if(confirm("Удалить?")) db.ref('global_chat').child(key).remove();
    };
    db.ref('global_chat').on('child_removed', s => {
        const el = document.getElementById('msg-' + s.key);
        if (el) el.remove();
    });
</script>
</body>
</html>
