<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerChat v22.0 - Final Fix</title>
    <!-- Библиотеки загрузятся сами через "магию" скрипта внизу -->
    <style>
        :root { --bg: #313338; --sidebar: #2b2d31; --accent: #5865f2; --gold: #f1c40f; --green: #23a559; }
        body { background: #1e1f22; color: #dbdee1; font-family: sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .sidebar { width: 240px; background: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid #1a1b1e; flex-shrink: 0; }
        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
        .header { padding: 15px; font-weight: bold; border-bottom: 1px solid #1a1b1e; color: white; }
        .cat { font-size: 11px; color: #949ba4; font-weight: bold; padding: 15px 10px 5px; }
        .ch { padding: 8px 15px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #949ba4; }
        .ch:hover { background: #35373c; color: white; }
        .ch.v-active { color: var(--green); font-weight: bold; }
        .v-list { margin-left: 35px; font-size: 13px; color: #dbdee1; }
        #msgs { flex: 1; overflow-y: auto; padding: 15px; }
        .msg { margin-bottom: 12px; }
        .m-u { font-weight: bold; color: white; margin-right: 8px; }
        .m-u.admin { color: var(--gold); }
        .input-box { padding: 20px; background: var(--bg); }
        input { width: 100%; background: #383a40; border: none; border-radius: 8px; padding: 12px; color: white; outline: none; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="header">GamerChat</div>
    <div class="cat">ТЕМЫ</div>
    <div class="ch active"># общее-семейное</div>
    <div class="cat">ГОЛОС</div>
    <div id="v-btn" class="ch" onclick="toggleVoice()">🔊 Основной канал</div>
    <div id="v-users" class="v-list"></div>
</div>

<div class="main">
    <div id="msgs"></div>
    <div class="input-box">
        <input type="text" id="ui" placeholder="Написать сообщение..." autocomplete="off">
    </div>
</div>

<script>
    // Хитрый способ загрузки библиотек без ошибок вывода
    function loadScripts() {
        const scripts = [
            'https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js',
            'https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js',
            'https://unpkg.com'
        ];
        
        let loaded = 0;
        scripts.forEach(url => {
            const s = document.createElement('script');
            s.src = url;
            s.onload = () => {
                loaded++;
                if (loaded === scripts.length) startApp();
            };
            document.head.appendChild(s);
        });
    }

    function startApp() {
        const cfg = {
            apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
            authDomain: "gamerchat-7a857" + ".firebaseapp.com",
            databaseURL: "https://gamerchat-7a857-default-rtdb" + ".firebaseio.com",
            projectId: "gamerchat-7a857",
            storageBucket: "gamerchat-7a857" + ".firebasestorage.app",
            messagingSenderId: "899769524812",
            appId: "1:899769524812:web:87609f2f41e3ab93084ae9"
        };

        firebase.initializeApp(cfg);
        const db = firebase.database();
        const icqSound = new Audio('https://myinstants.com');

        let myName = localStorage.getItem('chat_nick') || prompt("Введи ник:") || "Геймер";
        localStorage.setItem('chat_nick', myName);

        // ГОЛОС
        const peer = new Peer('gc-' + Math.floor(Math.random() * 10000));
        let myStream = null;

        window.toggleVoice = function() {
            const btn = document.getElementById('v-btn');
            if (myStream) {
                location.reload(); 
            } else {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    myStream = stream;
                    btn.classList.add('v-active');
                    btn.innerText = "🔊 В КАНАЛЕ (ВЫЙТИ)";
                    db.ref('voice_active').child(myName).set(peer.id);
                    db.ref('voice_active').child(myName).onDisconnect().remove();
                }).catch(() => alert("Нужно разрешить микрофон!"));
            }
        };

        peer.on('call', call => {
            call.answer(myStream);
            call.on('stream', s => { const a = new Audio(); a.srcObject = s; a.play(); });
        });

        db.ref('voice_active').on('child_added', s => {
            if (s.val() !== peer.id && myStream) peer.call(s.val(), myStream);
        });

        db.ref('voice_active').on('value', s => {
            const b = document.getElementById('v-users'); b.innerHTML = "";
            s.forEach(c => { b.innerHTML += `<div>● ${c.key}</div>`; });
        });

        // ЧАТ
        const ui = document.getElementById('ui');
        ui.onkeydown = (e) => {
            if (e.key === 'Enter' && ui.value.trim()) {
                db.ref('global_chat').push().set({ u: myName, t: ui.value });
                ui.value = "";
            }
        };

        db.ref('global_chat').limitToLast(50).on('child_added', s => {
            const d = s.val();
            const m = document.createElement('div');
            m.className = 'msg';
            const isAdm = d.u === 'CREATIV' ? 'admin' : '';
            m.innerHTML = `<span class="m-u ${isAdm}">${d.u}:</span><span>${d.t}</span>`;
            document.getElementById('msgs').appendChild(m);
            document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
            if (d.u !== myName) icqSound.play().catch(() => {});
        });
    }

    loadScripts();
</script>
</body>
</html>
