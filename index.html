<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat PRO v51.7.5 — TOTAL MASK</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --bg-servers: #1e1f22; --accent: #5865f2; --green: #23a559; --red: #ed4245; --text: #dbdee1; }
        body { background: var(--bg-servers); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .col-channels { width: 240px; background: var(--bg-sidebar); border-right: 1px solid #111; display: flex; flex-direction: column; flex-shrink: 0; }
        .col-chat { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; min-width: 0; }
        .col-users { width: 230px; background: var(--bg-sidebar); border-left: 1px solid #111; padding: 15px; flex-shrink: 0; }
        .my-profile-top { padding: 15px; background: #232428; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #111; }
        .u-ava { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; position: relative; }
        .mic-mini-bar { width: 32px; height: 4px; background: #111; border-radius: 2px; margin-top: 4px; overflow: hidden; margin-left: auto; margin-right: auto; }
        .mic-mini-fill { height: 100%; width: 0%; background: var(--green); transition: 0.03s; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
        .emoji-bar { padding: 8px 20px; background: rgba(0,0,0,0.1); display: flex; gap: 10px; overflow-x: auto; }
        .emoji-item { cursor: pointer; font-size: 20px; }
        .input-area { padding: 15px 20px 25px; }
        #ui { width: 100%; padding: 12px; background: #383a40; border: none; border-radius: 8px; color: white; outline: none; }
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .m-box { background: var(--bg-main); padding: 25px; border-radius: 12px; width: 400px; display: flex; flex-direction: column; gap: 10px; }
        .ava-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 10px 0; }
        .ava-item { width: 50px; height: 50px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
        .ava-active { border-color: var(--accent); }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg-sidebar); position: absolute; bottom: 0; right: 0; background: var(--green); }
        .speaking-border { border-color: var(--green) !important; box-shadow: 0 0 10px var(--green); }
    </style>
</head>
<body onclick="if(window.gCtx) { gCtx.resume(); }">

<div id="modal">
    <div class="m-box">
        <h3 style="margin:0; text-align:center">⚙️ ГЕРМЕТИЧНЫЕ НАСТРОЙКИ</h3>
        <label style="font-size:11px">НИК:</label><input type="text" id="in-nick" style="padding:10px; background:#1e1f22; color:white; border:none">
        <label style="font-size:11px">ЦВЕТ:</label><input type="color" id="in-color" style="width:100%; height:30px; border:none; background:none">
        <label style="font-size:11px">АВАТАР:</label><div class="ava-grid" id="ava-picker"></div>
        <label style="font-size:11px">МИКРОФОН:</label><select id="audio-in" style="padding:10px; background:#1e1f22; color:white; border:none"></select>
        <label style="font-size:11px">ЧУВСТВИТЕЛЬНОСТЬ: <span id="sens-val">10</span></label>
        <input type="range" id="in-sens" min="1" max="100" value="10" style="width:100%" oninput="document.getElementById('sens-val').innerText=this.value">
        <button class="btn" onclick="saveSets()">СОХРАНИТЬ</button>
        <button class="btn" style="background:var(--red)" onclick="adminClear()">ОЧИСТИТЬ ЧАТ</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="background:none; color:gray; border:none; cursor:pointer">Отмена</button>
    </div>
</div>

<div class="col-channels">
    <div class="my-profile-top">
        <div style="display:flex; align-items:center; gap:10px">
            <div class="u-ava"><img id="my-ava-img" style="width:100%; border-radius:50%"><div class="status-dot"></div></div>
            <b id="my-nick" style="font-size:14px">...</b>
        </div>
        <span onclick="openSets()" style="cursor:pointer; font-size:20px">⚙️</span>
    </div>
    <div style="flex:1; padding:15px">
        <div id="v-btn" onclick="toggleVoice()" style="cursor:pointer; color:#949ba4; font-weight:bold; margin-bottom:15px">🔈 ВОЙТИ В КАНАЛ</div>
        <div id="v-list"></div>
    </div>
</div>

<div class="col-chat">
    <div id="msgs"></div>
    <div class="emoji-bar" id="emoji-list"></div>
    <div class="input-area"><input type="text" id="ui" placeholder="Написать сообщение..." autocomplete="off"></div>
</div>

<div class="col-users">
    <div style="color: #949ba4; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 15px;" id="u-count">В СЕТИ — 0</div>
    <div id="u-list-online"></div>
</div>

<script>
    "use strict";
    const serverUrl = 'https://92ftbdnzwp.localto.net';
    const socket = io(serverUrl, { transports: ['polling', 'websocket'] });
    
    let myName = localStorage.getItem('chat_nick') || "Вован";
    let myColor = localStorage.getItem('chat_color') || "#ffffff";
    let myAva = localStorage.getItem('chat_ava') || "https://api.dicebear.com/7.x/pixel-art/svg?seed=77";
    let mySens = localStorage.getItem('chat_sens') || 10;
    
    let gCtx = new (window.AudioContext || window.webkitAudioContext)();
    let peer = null, myStream = null, isInVoice = false;

    const emojis = ['😊','😂','😎','🔥','🎮','💀','🤖','👾','👻','👑','💎','👍','🚀','💢','🤡'];
    const avas = Array.from({length:10}, (_,i) => `https://api.dicebear.com/7.x/pixel-art/svg?seed=${i+123}`);

    window.onload = () => { 
        updateUI(); 
        renderEmojis(); 
        setupPeer();
        socket.emit('user join', { name: myName, ava: myAva, color: myColor, inVoice: false });
    };

    async function setupPeer() {
        peer = new Peer(Math.random().toString(36).substr(2, 9), { host: '0.peerjs.com', port: 443, secure: true });
        peer.on('call', call => {
            call.answer(myStream);
            call.on('stream', rem => {
                const a = document.createElement('audio'); a.srcObject = rem; a.autoplay = true; document.body.appendChild(a);
            });
        });
        const devs = await navigator.mediaDevices.enumerateDevices();
        const sel = document.getElementById('audio-in');
        devs.filter(d => d.kind === 'audioinput').forEach(d => {
            sel.insertAdjacentHTML('beforeend', `<option value="${d.deviceId}">${d.label || 'Mic ' + (sel.length+1)}</option>`);
        });
    }

    function updateUI() {
        document.getElementById('my-nick').innerText = myName;
        document.getElementById('my-nick').style.color = myColor;
        document.getElementById('my-ava-img').src = myAva;
    }

    function renderEmojis() {
        const bar = document.getElementById('emoji-list'); bar.innerHTML = "";
        emojis.forEach(e => {
            const s = document.createElement('span'); s.className = 'emoji-item'; s.innerText = e;
            s.onclick = () => { const ui = document.getElementById('ui'); ui.value += e; ui.focus(); };
            bar.appendChild(s);
        });
    }

    socket.on('update users', users => {
        const vL = document.getElementById('v-list'), uL = document.getElementById('u-list-online');
        vL.innerHTML = ""; uL.innerHTML = ""; let count = 0;
        for(let id in users) {
            count++; const u = users[id];
            uL.insertAdjacentHTML('beforeend', `<div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; color:${u.color}"><img src="${u.ava}" style="width:20px; border-radius:50%"> ${u.name}</div>`);
            if(u.inVoice) {
                vL.insertAdjacentHTML('beforeend', `<div style="display:flex; align-items:center; gap:10px; margin-bottom:12px"><div style="text-align:center"><img src="${u.ava}" style="width:32px; border-radius:50%; border:2px solid ${u.isSpeaking?'var(--green)':'transparent'}" class="${u.isSpeaking?'speaking-border':''}"><div class="mic-mini-bar"><div class="mic-mini-fill" id="mic-v-${id}"></div></div></div><span style="font-size:13px; color:${u.color}">${u.name}</span></div>`);
            }
        }
        document.getElementById('u-count').innerText = `В СЕТИ — ${count}`;
    });

    socket.on('chat message', d => {
        document.getElementById('msgs').insertAdjacentHTML('beforeend', `<div><b style="color:${d.c}">${d.u}:</b> ${d.t}</div>`);
        document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
    });

    async function toggleVoice() {
        if (!isInVoice) {
            const devId = document.getElementById('audio-in').value;
            myStream = await navigator.mediaDevices.getUserMedia({ audio: devId ? { deviceId: { exact: devId } } : true });
            isInVoice = true; document.getElementById('v-btn').style.color = 'var(--green)';
            socket.emit('user join', { name: myName, ava: myAva, color: myColor, inVoice: true, pID: peer.id });
            const src = gCtx.createMediaStreamSource(myStream), anz = gCtx.createAnalyser();
            src.connect(anz); const dat = new Uint8Array(anz.frequencyBinCount);
            function loop() {
                if(!isInVoice) return;
                anz.getByteFrequencyData(dat); let vol = (Math.max(...dat)/255)*100;
                const fill = document.getElementById('mic-v-' + socket.id);
                if(fill) fill.style.width = vol + "%";
                socket.emit('speaking', vol > mySens);
                requestAnimationFrame(loop);
            } loop();
        } else { location.reload(); }
    }

    function openSets() {
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('in-nick').value = myName;
        document.getElementById('in-color').value = myColor;
        const p = document.getElementById('ava-picker'); p.innerHTML = "";
        avas.forEach(url => {
            const img = document.createElement('img'); img.src = url; 
            img.className = 'ava-item' + (url===myAva?' ava-active':'');
            img.onclick = () => { myAva = url; openSets(); };
            p.appendChild(img);
        });
    }

    function saveSets() {
        myName = document.getElementById('in-nick').value;
        myColor = document.getElementById('in-color').value;
        mySens = document.getElementById('in-sens').value;
        localStorage.setItem('chat_nick', myName);
        localStorage.setItem('chat_color', myColor);
        localStorage.setItem('chat_ava', myAva);
        localStorage.setItem('chat_sens', mySens);
        updateUI();
        socket.emit('user join', { name: myName, ava: myAva, color: myColor, inVoice: isInVoice });
        document.getElementById('modal').style.display = 'none';
    }

    function adminClear() { if(confirm("Очистить?")) socket.emit('admin clear'); }
    
    document.getElementById('ui').onkeydown = (e) => { 
        if(e.key === 'Enter' && e.target.value.trim()){ 
            socket.emit('chat message', { u: myName, t: e.target.value, c: myColor }); 
            e.target.value = ""; 
        } 
    };
</script>
</body>
</html>
