<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat PRO v51.3.2 — Admin Panel</title>
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --bg-servers: #1e1f22; --accent: #5865f2; --green: #23a559; --red: #ed4245; --text: #dbdee1; }
        body { background: var(--bg-servers); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .col-channels { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; }
        .col-chat { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; }
        .admin-btn { background: var(--red); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 10px; margin-top: 10px; display: none; }
        .ui-input { width:100%; padding:10px; background:#383a40; border:none; color:white; border-radius:5px; outline: none; }
    </style>
</head>
<body onclick="if(gCtx)gCtx.resume()">

<div class="col-channels">
    <div style="padding:15px; font-weight:bold; border-bottom:1px solid #222">🔊 GamerChat CONTROL</div>
    <div style="flex:1; padding:15px">
        <div id="v-btn" onclick="toggleVoice()" style="cursor:pointer; color:#949ba4">🔈 Войти в голос</div>
        <div id="v-list" style="margin-top:10px"></div>
        
        <!-- КНОПКА ТОЛЬКО ДЛЯ ТЕБЯ -->
        <button id="admin-clear" class="admin-btn" onclick="clearChat()">ОЧИСТИТЬ ВЕСЬ ЧАТ</button>
    </div>
    <div style="padding:15px; background:#232428"><b id="my-nick">...</b></div>
</div>

<div class="col-chat">
    <div id="msgs"></div>
    <div style="padding:20px"><input type="text" id="ui" class="ui-input" placeholder="Написать..."></div>
</div>

<script>
    "use strict";
    const socket = io('http://localhost:3000'); 
    
    // ТВОЙ НИК — КЛЮЧ К УПРАВЛЕНИЮ
    let myName = localStorage.getItem('chat_nick') || "Вован"; 
    let gCtx = new (window.AudioContext || window.webkitAudioContext)(), myStream = null, isInVoice = false;

    document.getElementById('my-nick').innerText = myName;

    // ПРОВЕРКА НА АДМИНА
    if (myName.toLowerCase() === "вован") {
        document.getElementById('admin-clear').style.display = "block";
    }

    // ЛОГИКА УПРАВЛЕНИЯ (ОЧИСТКА)
    function clearChat() {
        if(confirm("Удалить всю историю сообщений для ВСЕХ?")) {
            socket.emit('admin clear');
        }
    }

    socket.on('chat cleared', () => {
        document.getElementById('msgs').innerHTML = "<i>Чат был очищен администратором</i>";
    });

    // ОБЫЧНЫЙ ЧАТ
    const ui = document.getElementById('ui');
    ui.onkeydown = (e) => { 
        if(e.key === 'Enter' && ui.value.trim()){ 
            socket.emit('chat message', { u: myName, t: ui.value }); 
            ui.value = ""; 
        } 
    };
    
    socket.on('chat message', d => {
        document.getElementById('msgs').insertAdjacentHTML('beforeend', `<div><b>${d.u}:</b> ${d.t}</div>`);
        document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
    });

    // ГОЛОС
    async function toggleVoice() {
        if (!isInVoice) {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isInVoice = true;
                document.getElementById('v-btn').style.color = 'var(--green)';
                socket.emit('user join', { name: myName, inVoice: true });
            } catch(e) { alert("Включи микрофон!"); }
        } else { location.reload(); }
    }

    socket.on('update users', users => {
        const list = document.getElementById('v-list');
        list.innerHTML = "";
        for(let id in users) if(users[id].inVoice) list.insertAdjacentHTML('beforeend', `<div style="color:#949ba4">● ${users[id].name}</div>`);
    });

    socket.emit('user join', { name: myName, inVoice: false });
</script>
</body>
</html>
