<body>
<!-- Сюда будут падать входящие голоса, чтобы браузер их не блокировал -->
<div id="remote-audio-container" style="display:none"></div>

<div id="modal">
    <div class="m-content">
        <h3 style="margin:0">Устройства</h3>
        <label style="font-size:12px">Ник:</label>
        <input type="text" id="set-nick">
        <div class="color-p" id="color-picker"></div>
        <label style="font-size:11px">Микрофон:</label>
        <select id="mic-list"></select>
        <label style="font-size:11px">Динамики:</label>
        <select id="speaker-list"></select>
        <button class="ptt-btn" onclick="saveSettings()" style="padding:10px">Сохранить</button>
    </div>
</div>

<div class="sidebar">
    <div class="header">GamerChat <span onclick="openSettings()" style="cursor:pointer; font-size:18px;">&#9881;</span></div>
    <div class="cat">Текстовые каналы</div>
    <div style="padding: 8px 15px; color:#949ba4">&#35; общее-семейное</div>
    <div class="cat">Голосовая рация</div>
    <div id="net-st" style="padding: 8px 15px; color:var(--red); font-size: 10px; font-weight:bold">● СЕТЬ: ОТКЛЮЧЕНО</div>
    <div id="v-users" class="v-list"></div>
</div>

<div class="main">
    <div id="msgs"></div>
    <div class="emoji-bar" id="eb"></div>
    <div class="radio-box">
        <button id="ptt-trigger" class="ptt-btn" onclick="connectVoiceManually()">ПОДКЛЮЧИТЬСЯ К ГОЛОСУ</button>
        <button id="leave-btn" class="leave-btn" onclick="disconnectVoice()">ВЫЙТИ ИЗ КАНАЛА</button>
    </div>
    <div style="padding:15px 20px; background: var(--bg);">
        <input type="text" id="ui" style="width:100%; background:#383a40; border:none; padding:14px; border-radius:8px; color:white; outline:none;" placeholder="Сообщение..." autocomplete="off">
    </div>
</div>

<script>
    const cfg = {
        apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
        authDomain: "gamerchat-7a857.firebaseapp.com",
        databaseURL: "https://gamerchat-7a857-default-rtdb.firebaseio.com",
        projectId: "gamerchat-7a857",
        storageBucket: "gamerchat-7a857.firebasestorage.app",
        messagingSenderId: "899769524812",
        appId: "1:899769524812:web:87609f2f41e3ab93084ae9"
    };

    firebase.initializeApp(cfg);
    const db = firebase.database();
    const icqSound = new Audio('https://www.myinstants.com/media/sounds/icq-uh-oh.mp3');

    let myName = localStorage.getItem('chat_nick') || "Геймер";
    let myColor = localStorage.getItem('chat_color') || "#5865f2";
    let selectedMic = localStorage.getItem('chat_mic') || 'default';
    let selectedSpk = localStorage.getItem('chat_spk') || 'default';
    const colorOptions = ["#5865f2", "#ed4245", "#3ba55d", "#faa81a", "#eb459e", "#9b59b6", "#1abc9c", "#f1c40f"];

    let myStream = null;
    let connections = {};

    async function connectVoiceManually() {
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: selectedMic } });
            // Вместо выключения трека, мы просто ставим его на "Mute" в базе, но WebRTC держим активным
            myStream.getAudioTracks().forEach(t => t.enabled = false);
            
            const btn = document.getElementById('ptt-trigger');
            btn.innerHTML = "ЗАЖМИ И ГОВОРИ &#127897;";
            btn.onclick = null;
            document.getElementById('leave-btn').style.display = "block";
            document.getElementById('net-st').style.color = "var(--green)";
            document.getElementById('net-st').innerText = "● СЕТЬ: ОНЛАЙН";

            const myRef = db.ref('voice_v4').child(myName);
            myRef.set({ speaking: false, color: myColor });
            myRef.onDisconnect().remove();

            setupPTT();
            listenForSignals();
        } catch (e) { alert("Ошибка доступа к микрофону!"); }
    }

    function setupPTT() {
        const ptt = document.getElementById('ptt-trigger');
        const talk = (on) => {
            if (!myStream) return;
            // Пробуждаем Audio Context для всех
            if (window.AudioContext) new AudioContext().resume();
            
            myStream.getAudioTracks().forEach(t => t.enabled = on);
            db.ref('voice_v4').child(myName).update({ speaking: on });
        };
        ptt.onmousedown = () => talk(true);
        ptt.onmouseup = () => talk(false);
        ptt.ontouchstart = (e) => { e.preventDefault(); talk(true); };
        ptt.ontouchend = () => talk(false);
    }

    function disconnectVoice() {
        if (myStream) myStream.getTracks().forEach(t => t.stop());
        db.ref('voice_v4').child(myName).remove();
        db.ref('signals_v4').child(myName).remove();
        Object.values(connections).forEach(pc => pc.close());
        connections = {};
        myStream = null;
        document.getElementById('remote-audio-container').innerHTML = "";
        
        const btn = document.getElementById('ptt-trigger');
        btn.innerText = "ПОДКЛЮЧИТЬСЯ К ГОЛОСУ";
        btn.onclick = connectVoiceManually;
        document.getElementById('leave-btn').style.display = "none";
        document.getElementById('net-st').style.color = "var(--red)";
        document.getElementById('net-st').innerText = "● СЕТЬ: ОТКЛЮЧЕНО";
    }

    function listenForSignals() {
        db.ref('voice_v4').on('value', s => {
            const b = document.getElementById('v-users'); b.innerHTML = "";
            s.forEach(c => {
                const u = c.val();
                b.innerHTML += `<div class="v-u"><div class="ava ${u.speaking?'speaking':''}" style="background:${u.color || '#5865f2'}">${c.key.charAt(0)}</div><span>${c.key}</span></div>`;
                if (c.key !== myName && !connections[c.key]) setupWebRTC(c.key);
            });
        });

        db.ref('signals_v4').child(myName).on('child_added', async s => {
            const d = s.val(); const from = d.from;
            if (!connections[from]) setupWebRTC(from);
            const pc = connections[from];
            try {
                if (d.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
                    const ans = await pc.createAnswer();
                    await pc.setLocalDescription(ans);
                    sendSignal(from, { type: 'answer', answer: ans });
                } else if (d.type === 'answer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
                } else if (d.type === 'ice' && d.ice) {
                    if (d.ice.sdpMid !== null || d.ice.sdpMLineIndex !== null) {
                        await pc.addIceCandidate(new RTCIceCandidate(d.ice));
                    }
                }
            } catch (e) {}
            s.ref.remove();
        });
    }

    function setupWebRTC(target) {
        // Расширенный список STUN серверов для обхода любых блокировок
        const config = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun.services.mozilla.com' },
                { urls: 'stun:stun.stunprotocol.org:3478' }
            ] 
        };
        const pc = new RTCPeerConnection(config);
        connections[target] = pc;
        
        if (myStream) myStream.getTracks().forEach(t => pc.addTrack(t, myStream));
        
        pc.onicecandidate = e => {
            if (e.candidate && (e.candidate.sdpMid !== null || e.candidate.sdpMLineIndex !== null)) {
                sendSignal(target, { type: 'ice', ice: e.candidate });
            }
        };

        pc.ontrack = e => {
            // Создаем настоящий элемент аудио в DOM
            let audioId = 'audio-' + target.replace(/\s/g, '');
            let audioEl = document.getElementById(audioId);
            if (!audioEl) {
                audioEl = document.createElement('audio');
                audioEl.id = audioId;
                audioEl.autoplay = true;
                document.getElementById('remote-audio-container').appendChild(audioEl);
            }
            audioEl.srcObject = e.streams[0];
            if (audioEl.setSinkId) audioEl.setSinkId(selectedSpk);
            audioEl.play().catch(() => console.log("Play blocked by browser"));
        };

        if (myName < target) {
            pc.onnegotiationneeded = async () => {
                const off = await pc.createOffer();
                await pc.setLocalDescription(off);
                sendSignal(target, { type: 'offer', offer: off });
            };
        }
    }

    function sendSignal(to, data) { db.ref('signals_v4').child(to).push({ ...data, from: myName }); }

    window.openSettings = () => {
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('set-nick').value = myName;
        const cp = document.getElementById('color-picker'); cp.innerHTML = "";
        colorOptions.forEach(c => {
            const d = document.createElement('div');
            d.className = `color-dot ${c === myColor ? 'selected' : ''}`;
            d.style.background = c;
            d.onclick = () => { myColor = c; openSettings(); };
            cp.appendChild(d);
        });
        navigator.mediaDevices.enumerateDevices().then(devs => {
            const mS = document.getElementById('mic-list');
            const sS = document.getElementById('speaker-list');
            mS.innerHTML = ""; sS.innerHTML = "";
            devs.forEach(d => {
                const opt = `<option value="${d.deviceId}" ${d.deviceId===(d.kind==='audioinput'?selectedMic:selectedSpk)?'selected':''}>${d.label || 'Устройство'}</option>`;
                if (d.kind === 'audioinput') mS.innerHTML += opt;
                if (d.kind === 'audiooutput') sS.innerHTML += opt;
            });
        });
    };

    window.saveSettings = () => {
        localStorage.setItem('chat_nick', document.getElementById('set-nick').value || myName);
        localStorage.setItem('chat_color', myColor);
        localStorage.setItem('chat_mic', document.getElementById('mic-list').value);
        localStorage.setItem('chat_spk', document.getElementById('speaker-list').value);
        document.getElementById('modal').style.display = 'none';
    };

    const emojis = ["&#128512;","&#128514;","&#128522;","&#128525;","&#128526;","&#129300;","&#128077;","&#128293;","&#10024;","&#127881;","&#128075;","&#128557;","&#128561;","&#128545;","&#128128;","&#128169;","&#10084;","&#9989;","&#10060;","&#127918;"];
    emojis.forEach(e => {
        const s = document.createElement('span'); s.className = 'e-item'; s.innerHTML = e;
        s.onclick = () => { document.getElementById('ui').value += s.innerText; document.getElementById('ui').focus(); };
        document.getElementById('eb').appendChild(s);
    });

    document.getElementById('ui').onkeydown = (e) => {
        if (e.key === 'Enter' && e.target.value.trim()) {
            db.ref('global_chat').push().set({ u: myName, t: e.target.value, color: myColor }); e.target.value = "";
        }
    };

    db.ref('global_chat').limitToLast(30).on('child_added', s => {
        const d = s.val(); const m = document.createElement('div'); m.className = 'msg';
        m.innerHTML = `<div class="ava" style="background:${d.color || '#5865f2'}">${d.u.charAt(0)}</div><div><span class="m-u ${d.u==='CREATIV'?'admin':''}">${d.u}:</span><span style="color:#dcddde">${d.t}</span></div>`;
        document.getElementById('msgs').appendChild(m);
        document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
        if (d.u !== myName) icqSound.play().catch(()=>{});
    });
</script>
</body>
</html>
