<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat - Version 2.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #1e1f22; color: #dbdee1; font-family: sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .servers { width: 72px; background-color: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 12px; border-right: 1px solid #2b2d31; }
        .icon { width: 48px; height: 48px; background-color: #5865f2; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .icon:hover { border-radius: 30%; background-color: #4752c4; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #313338; position: relative; }
        #msgs { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .msg { margin-bottom: 12px; background: rgba(79, 84, 92, 0.16); padding: 10px; border-radius: 8px; border-left: 4px solid #5865f2; position: relative; }
        .author { color: #fff; font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .del-btn { color: #f23f43; cursor: pointer; font-size: 0.7em; margin-left: 10px; text-transform: uppercase; background: rgba(242, 63, 67, 0.1); padding: 2px 5px; border-radius: 3px; }
        .input-box { padding: 20px; }
        input { width: 100%; background: #383a40; border: none; border-radius: 8px; padding: 12px; color: white; outline: none; box-sizing: border-box; }
        .status { text-align: center; color: #23a559; padding: 5px; font-size: 0.8em; font-weight: bold; background: #2b2d31; }
        #voice-wrap { display:none; position:fixed; top:0; left:72px; right:0; bottom:0; background:#1e1f22; z-index:1000; }
    </style>
</head>
<body>
    <div class="servers">
        <div class="icon" onclick="location.reload()">G</div>
        <div class="icon" style="margin-top:10px; background:#23a559;" onclick="toggleVoice()">🎤</div>
    </div>

    <div id="voice-wrap">
        <div style="padding:10px; background:#2b2d31; display:flex; justify-content:space-between; align-items:center;">
            <span>Голосовой канал</span>
            <button onclick="toggleVoice()" style="cursor:pointer; background:#f23f43; border:none; color:white; padding:5px 15px; border-radius:5px;">ВЫЙТИ</button>
        </div>
        <iframe src="https://8x8.vc/vpaas-magic-cookie-3d5f9b8c0e6a4b1ba6848c9527f311c1/GamerChat_Room_48" allow="microphone; camera" style="width:100%; height:calc(100% - 45px); border:none;"></iframe>
    </div>

    <div class="chat-area">
        <div id="st" class="status">ПОДКЛЮЧЕНИЕ К СЕРВЕРУ...</div>
        <div id="msgs"></div>
        <div class="input-box"><input type="text" id="ui" placeholder="Напиши что-нибудь и Enter..."></div>
    </div>

<script>
    const cfg = {
        apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
        authDomain: "gamerchat-7a857.firebaseapp.com",
        databaseURL: "https://gamerchat-7a857-default-rtdb.firebaseio.com",
        projectId: "gamerchat-7a857",
        storageBucket: "gamerchat-7a857.firebasestorage.app",
        messagingSenderId: "899769524812",
        appId: "1:899769524812:web:87609f2f41e3ab93084ae9"
    };

    function toggleVoice() {
        const v = document.getElementById('voice-wrap');
        v.style.display = (v.style.display === 'none') ? 'block' : 'none';
    }

    window.onload = function() {
        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(cfg);
            const db = firebase.database();

            // ЗАПОМИНАЕМ НИК
            let myName = localStorage.getItem('chat_nick');
            if (!myName) {
                myName = prompt("Введи свой никнейм:", "Геймер") || "Аноним";
                localStorage.setItem('chat_nick', myName);
            }

            db.ref('.info/connected').on('value', s => {
                document.getElementById('st').innerText = s.val() ? "ТЫ В СЕТИ! ПИШИ!" : "ПОИСК СЕРВЕРА...";
            });

            document.getElementById('ui').onkeypress = function(e) {
                if (e.key === 'Enter' && this.value.trim() !== "") {
                    db.ref('global_chat').push().set({ u: myName, t: this.value });
                    this.value = "";
                }
            };

            // ЛОГИКА ОТОБРАЖЕНИЯ И УДАЛЕНИЯ
            db.ref('global_chat').limitToLast(50).on('child_added', s => {
                const d = s.val();
                const key = s.key;
                const m = document.createElement('div');
                m.className = 'msg';
                m.id = 'msg-' + key;

                if (d.u === "CREATIV") {
                    m.style.borderLeft = "4px solid #ffca28";
                    m.style.background = "rgba(255, 202, 40, 0.1)";
                }

                // Кнопка удаления (видна тебе или админу CREATIV)
                let delBtn = (d.u === myName || myName === "CREATIV") ? `<span class="del-btn" onclick="deleteMsg('${key}')">Удалить</span>` : "";

                m.innerHTML = `<div class="author" ${d.u === "CREATIV" ? 'style="color:#ffca28"' : ''}>
                    <span>${d.u}</span>${delBtn}
                </div><div>${d.t}</div>`;
                
                document.getElementById('msgs').appendChild(m);
                document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
            });

            // Слушаем удаление из базы
            db.ref('global_chat').on('child_removed', s => {
                const m = document.getElementById('msg-' + s.key);
                if (m) m.remove();
            });

            window.deleteMsg = function(key) {
                if(confirm("Удалить сообщение?")) {
                    db.ref('global_chat').child(key).remove();
                }
            };
        }
    };
</script>
</body>
</html>
