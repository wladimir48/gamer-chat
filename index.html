<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat PRO v51.3.2 — ULTIMATE</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --bg-servers: #1e1f22; --accent: #5865f2; --green: #23a559; --red: #ed4245; --text: #dbdee1; }
        body { background: var(--bg-servers); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .col-channels { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        .col-chat { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; min-width: 0; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
        .input-area { padding: 20px; background: var(--bg-main); display: flex; gap: 10px; align-items: center; }
        #ui { flex: 1; padding: 12px; background: #383a40; border: none; border-radius: 8px; color: white; outline: none; }
        .admin-panel { padding: 15px; background: rgba(0,0,0,0.3); border-top: 2px solid var(--red); display: none; }
        .v-user { padding: 5px 15px; color: #949ba4; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .btn-opt { background: #4e5058; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-top: 5px; }
        .emoji-btn { cursor: pointer; font-size: 20px; filter: grayscale(1); transition: 0.2s; }
        .emoji-btn:hover { filter: grayscale(0); transform: scale(1.2); }
    </style>
</head>
<body onclick="if(window.gCtx)gCtx.resume()">

<div class="col-channels">
    <div style="padding:15px; font-weight:bold; border-bottom:1px solid #222; color:white">🔊 GamerChat PRO</div>
    <div style="flex:1; padding:15px; overflow-y:auto">
        <div id="v-btn" onclick="toggleVoice()" style="cursor:pointer; color:#949ba4; font-weight:bold">🔈 Войти в голос</div>
        <div id="v-list" style="margin-top:10px"></div>
    </div>
    
    <!-- РАСШИРЕННЫЕ НАСТРОЙКИ АДМИНА -->
    <div id="admin-box" class="admin-panel">
        <div style="color:var(--red); font-size:10px; font-weight:bold; margin-bottom:10px">ADMIN SETTINGS</div>
        <label style="font-size:10px">ЧУВСТВИТЕЛЬНОСТЬ: <span id="sens-val">10</span></label>
        <input type="range" id="sens-range" min="1" max="100" value="10" style="width:100%" oninput="updateSens(this.value)">
        <button class="btn-opt" style="background:var(--red); width:100%; margin-top:10px" onclick="adminClear()">ОЧИСТИТЬ ЧАТ</button>
    </div>

    <div style="padding:15px; background:#232428; display:flex; justify-content:space-between; align-items:center">
        <b id="display-nick">...</b>
        <span onclick="location.reload()" style="cursor:pointer">🔄</span>
    </div>
</div>

<div class="col-chat">
    <div id="msgs"></div>
    <div class="input-area">
        <span class="emoji-btn" onclick="addEmoji('😊')">😊</span>
        <input type="text" id="ui" placeholder="Напиши сообщение..." autocomplete="off">
    </div>
</div>

<script>
    "use strict";

    // ИСПРАВЛЕННОЕ ПОДКЛЮЧЕНИЕ (SECURE: FALSE)
    const socket = io('https://92ftbdnzwp.localto.net', {
        transports: ['polling', 'websocket'],
        upgrade: true,
        secure: false, 
        rejectUnauthorized: false
    });

    let myName = localStorage.getItem('chat_nick') || "Вован";
    let mySens = 10;
    let gCtx = new (window.AudioContext || window.webkitAudioContext)(), myStream = null, peer = null, isInVoice = false;

    document.getElementById('display-nick').innerText = myName;
    if (myName.toLowerCase() === "вован") document.getElementById('admin-box').style.display = "block";

    // СМАЙЛИКИ
    function addEmoji(e) { document.getElementById('ui').value += e; document.getElementById('ui').focus(); }
    const parseEmoji = (t) => t.replace(/:\)/g, '😊').replace(/:D/g, '😁').replace(/<3/g, '❤️');

    // ГОЛОС (PEERJS)
    peer = new Peer(myName.toLowerCase().replace(/[^a-z]/g,''), { host: '0.peerjs.com', port: 443, secure: true, path: '/' });
    
    peer.on('call', (call) => {
        call.answer(myStream);
        call.on('stream', (rem) => {
            const a = document.createElement('audio'); a.srcObject = rem; a.autoplay = true; document.body.appendChild(a);
        });
    });

    async function toggleVoice() {
        if (!isInVoice) {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            isInVoice = true;
            document.getElementById('v-btn').style.color = 'var(--green)';
            socket.emit('user join', { name: myName, inVoice: true });
            socket.emit('get voice users');
        } else { location.reload(); }
    }

    // ЧАТ
    const ui = document.getElementById('ui');
    ui.onkeydown = (e) => {
        if(e.key === 'Enter' && ui.value.trim()){
            socket.emit('chat message', { u: myName, t: parseEmoji(ui.value) });
            ui.value = "";
        }
    };
    
    socket.on('chat message', d => {
        document.getElementById('msgs').insertAdjacentHTML('beforeend', `<div><b style="color:var(--accent)">${d.u}:</b> ${d.t}</div>`);
        document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
    });

    // НАСТРОЙКИ
    function updateSens(v) { mySens = v; document.getElementById('sens-val').innerText = v; }
    function adminClear() { if(confirm("Очистить историю?")) socket.emit('admin clear'); }
    socket.on('chat cleared', () => { document.getElementById('msgs').innerHTML = "<i>Чат очищен</i>"; });

    socket.on('update users', (users) => {
        const vList = document.getElementById('v-list'); vList.innerHTML = "";
        for(let id in users) if(users[id].inVoice) vList.insertAdjacentHTML('beforeend', `<div class="v-user">● ${users[id].name}</div>`);
    });

    socket.on('call users', (users) => {
        for (let id in users) {
            if (users[id].name.toLowerCase() !== myName.toLowerCase()) {
                const call = peer.call(users[id].name.toLowerCase(), myStream);
                call.on('stream', (rem) => {
                    const a = document.createElement('audio'); a.srcObject = rem; a.autoplay = true; document.body.appendChild(a);
                });
            }
        }
    });

    socket.emit('user join', { name: myName, inVoice: false });
</script>
</body>
</html>
