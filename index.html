<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerChat v41.0 - Voice Boost</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --bg: #313338; --sidebar: #2b2d31; --accent: #5865f2; --gold: #f1c40f; --green: #23a559; --red: #ed4245; }
        body { background: #1e1f22; color: #dbdee1; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .sidebar { width: 260px; background: var(--sidebar); display: flex; flex-direction: column; border-right: 1px solid #1a1b1e; flex-shrink: 0; }
        .header { padding: 15px; font-weight: bold; border-bottom: 1px solid #1a1b1e; display: flex; justify-content: space-between; align-items: center; color: white; }
        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
        .cat { font-size: 11px; color: #949ba4; font-weight: bold; padding: 20px 15px 5px; text-transform: uppercase; }
        .v-list { padding-left: 40px; display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .v-u { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #dbdee1; }
        .ava { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; font-weight: bold; border: 2px solid transparent; transition: 0.2s; flex-shrink: 0; }
        .speaking { border-color: var(--green) !important; box-shadow: 0 0 15px var(--green); transform: scale(1.1); background-color: var(--green) !important; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 12px; display: flex; gap: 12px; align-items: flex-start; }
        .m-u { font-weight: bold; color: white; margin-right: 5px; }
        .emoji-bar { padding: 10px 15px; display: flex; gap: 12px; overflow-x: auto; background: rgba(0,0,0,0.2); border-top: 1px solid #222; min-height: 40px; }
        .e-item { cursor: pointer; font-size: 22px; }
        .radio-box { padding: 15px 20px; background: rgba(0,0,0,0.3); border-top: 1px solid #222; display: flex; flex-direction: column; gap: 10px; }
        .ptt-btn { background: var(--accent); color: white; border: none; padding: 20px; border-radius: 8px; font-weight: bold; cursor: pointer; user-select: none; transition: 0.2s; text-transform: uppercase; width: 100%; font-size: 16px; }
        .ptt-btn:active { background: var(--green); }
        .leave-btn { background: var(--red); color: white; border: none; padding: 10px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer; display: none; }
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .m-content { background: var(--bg); padding: 25px; border-radius: 12px; width: 340px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #444; }
        select, input { background: #1e1f22; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; width: 100%; box-sizing: border-box; }
        .color-p { display: flex; gap: 8px; flex-wrap: wrap; margin: 5px 0; }
        .color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-dot.selected { border-color: white; transform: scale(1.2); }
    </style>
</head>
<body>
<div id="remote-audios" style="display:none"></div>

<div id="modal">
    <div class="m-content">
        <h3>Устройства</h3>
        <label>Ник:</label> <input type="text" id="set-nick">
        <label>Цвет:</label> <div class="color-p" id="color-picker"></div>
        <label>Микрофон:</label> <select id="mic-list"></select>
        <label>Динамики:</label> <select id="speaker-list"></select>
        <button class="ptt-btn" onclick="saveSettings()" style="padding:10px">Применить</button>
    </div>
</div>

<div class="sidebar">
    <div class="header">GamerChat <span onclick="openSettings()" style="cursor:pointer; font-size:18px;">&#9881;</span></div>
    <div class="cat">Текстовые каналы</div>
    <div style="padding: 8px 15px; color:#949ba4">&#35; общее-семейное</div>
    <div class="cat">Голосовая рация</div>
    <div id="net-st" style="padding: 8px 15px; color:var(--red); font-size: 10px; font-weight:bold">● СЕТЬ: ОТКЛЮЧЕНО</div>
    <div id="v-users" class="v-list"></div>
</div>

<div class="main">
    <div id="msgs"></div>
    <div class="emoji-bar" id="eb"></div>
    <div class="radio-box">
        <button id="ptt-trigger" class="ptt-btn" onclick="connectVoice()">ПОДКЛЮЧИТЬСЯ К ГОЛОСУ</button>
        <button id="leave-btn" class="leave-btn" onclick="disconnectVoice()">ВЫЙТИ ИЗ КАНАЛА</button>
    </div>
    <div style="padding:15px 20px; background: var(--bg);"><input type="text" id="ui" style="width:100%; background:#383a40; border:none; padding:12px; border-radius:8px; color:white; outline:none;" placeholder="Написать в чат..." autocomplete="off"></div>
</div>

<script>
    const cfg = {
        apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
        authDomain: "gamerchat-7a857.firebaseapp.com",
        databaseURL: "https://gamerchat-7a857-default-rtdb.firebaseio.com",
        projectId: "gamerchat-7a857",
        storageBucket: "gamerchat-7a857.firebasestorage.app",
        messagingSenderId: "899769524812",
        appId: "1:899769524812:web:87609f2f41e3ab93084ae9"
    };

    firebase.initializeApp(cfg);
    const db = firebase.database();
    const icqSound = new Audio('https://www.myinstants.com/media/sounds/icq-uh-oh.mp3');

    let myName = localStorage.getItem('chat_nick') || "Геймер";
    let myColor = localStorage.getItem('chat_color') || "#5865f2";
    let selectedMic = localStorage.getItem('chat_mic') || 'default';
    let selectedSpk = localStorage.getItem('chat_spk') || 'default';
    const colorOptions = ["#5865f2", "#ed4245", "#3ba55d", "#faa81a", "#eb459e", "#9b59b6", "#1abc9c", "#f1c40f"];

    let myStream = null;
    let connections = {};

    async function connectVoice() {
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: selectedMic } });
            myStream.getAudioTracks().forEach(t => t.enabled = false);
            
            const btn = document.getElementById('ptt-trigger');
            btn.innerHTML = "ЗАЖМИ И ГОВОРИ &#127897;";
            btn.onclick = null;
            document.getElementById('leave-btn').style.display = "block";
            document.getElementById('net-st').style.color = "var(--green)";
            document.getElementById('net-st').innerText = "● СЕТЬ: ОНЛАЙН";

            db.ref('voice_v6').child(myName).set({ speaking: false, color: myColor });
            db.ref('voice_v6').child(myName).onDisconnect().remove();

            setupPTT();
            listenForSignals();
        } catch (e) { alert("Ошибка микрофона!"); }
    }

    function setupPTT() {
        const ptt = document.getElementById('ptt-trigger');
        const talk = (on) => {
            if (!myStream) return;
            myStream.getAudioTracks().forEach(t => t.enabled = on);
            db.ref('voice_v6').child(myName).update({ speaking: on });
        };
        ptt.onmousedown = () => talk(true); ptt.onmouseup = () => talk(false);
        ptt.ontouchstart = (e) => { e.preventDefault(); talk(true); }; ptt.ontouchend = () => talk(false);
    }

    function disconnectVoice() {
        if (myStream) myStream.getTracks().forEach(t => t.stop());
        db.ref('voice_v6').child(myName).remove();
        Object.values(connections).forEach(pc => pc.close());
        connections = {}; myStream = null;
        document.getElementById('remote-audios').innerHTML = "";
        const btn = document.getElementById('ptt-trigger');
        btn.innerText = "ПОДКЛЮЧИТЬСЯ К ГОЛОСУ"; btn.onclick = connectVoice;
        document.getElementById('leave-btn').style.display = "none";
        document.getElementById('net-st').style.color = "var(--red)";
        document.getElementById('net-st').innerText = "● СЕТЬ: ОТКЛЮЧЕНО";
    }

    function listenForSignals() {
        db.ref('voice_v6').on('value', s => {
            const b = document.getElementById('v-users'); b.innerHTML = "";
            s.forEach(c => {
                const u = c.val();
                b.innerHTML += `<div class="v-u"><div class="ava ${u.speaking?'speaking':''}" style="background:${u.color || '#5865f2'}">${c.key.charAt(0)}</div><span>${c.key}</span></div>`;
                if (c.key !== myName && !connections[c.key]) setupWebRTC(c.key);
            });
        });

        db.ref('signals_v6').child(myName).on('child_added', async s => {
            const d = s.val(); const from = d.from;
            if (!connections[from]) setupWebRTC(from);
            const pc = connections[from];
            try {
                if (d.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
                    const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
                    sendSignal(from, { type: 'answer', answer: ans });
                } else if (d.type === 'answer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
                } else if (d.type === 'ice' && d.ice) {
                    if (d.ice.candidate) await pc.addIceCandidate(new RTCIceCandidate(d.ice));
                }
            } catch (e) {}
            s.ref.remove();
        });
    }

    function setupWebRTC(target) {
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] });
        connections[target] = pc;
        if (myStream) myStream.getTracks().forEach(t => pc.addTrack(t, myStream));
        pc.onicecandidate = e => { if (e.candidate) sendSignal(target, { type: 'ice', ice: e.candidate }); };
        pc.ontrack = e => {
            console.log("ЗВУК ПОЛУЧЕН ОТ: " + target);
            let a = document.createElement('audio'); a.autoplay = true; a.srcObject = e.streams[0];
            if (a.setSinkId) a.setSinkId(selectedSpk);
            document.getElementById('remote-audios').appendChild(a);
        };
        if (myName < target) {
            pc.onnegotiationneeded = async () => {
                const off = await pc.createOffer(); await pc.setLocalDescription(off);
                sendSignal(target, { type: 'offer', offer: off });
            };
        }
    }

    function sendSignal(to, data) { db.ref('signals_v6').child(to).push({ ...data, from: myName }); }

    window.openSettings = () => {
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('set-nick').value = myName;
        const cp = document.getElementById('color-picker'); cp.innerHTML = "";
        colorOptions.forEach(c => {
            const d = document.createElement('div'); d.className = `color-dot ${c === myColor ? 'selected' : ''}`;
            d.style.background = c; d.onclick = () => { myColor = c; openSettings(); };
            cp.appendChild(d);
        });
        navigator.mediaDevices.enumerateDevices().then(devs => {
            const mS = document.getElementById('mic-list'); const sS = document.getElementById('speaker-list');
            mS.innerHTML = ""; sS.innerHTML = "";
            devs.forEach(d => {
                const opt = `<option value="${d.deviceId}" ${d.deviceId===(d.kind==='audioinput'?selectedMic:selectedSpk)?'selected':''}>${d.label || 'Устройство'}</option>`;
                if (d.kind === 'audioinput') mS.innerHTML += opt;
                if (d.kind === 'audiooutput') sS.innerHTML += opt;
            });
        });
    };

    window.saveSettings = () => {
        localStorage.setItem('chat_nick', document.getElementById('set-nick').value || myName);
        localStorage.setItem('chat_color', myColor);
        localStorage.setItem('chat_mic', document.getElementById('mic-list').value);
        localStorage.setItem('chat_spk', document.getElementById('speaker-list').value);
        document.getElementById('modal').style.display = 'none';
    };

    const emojis = ["&#128512;","&#128514;","&#128522;","&#128525;","&#128526;","&#129300;","&#128077;","&#128293;","&#10024;","&#127881;","&#128075;","&#128557;","&#128561;","&#128545;","&#128128;","&#128169;","&#10084;","&#9989;","&#10060;","&#127918;"];
    emojis.forEach(e => {
        const s = document.createElement('span'); s.className = 'e-item'; s.innerHTML = e;
        s.onclick = () => { document.getElementById('ui').value += s.innerText; document.getElementById('ui').focus(); };
        document.getElementById('eb').appendChild(s);
    });

    document.getElementById('ui').onkeydown = (e) => {
        if (e.key === 'Enter' && e.target.value.trim()) {
            db.ref('global_chat').push().set({ u: myName, t: e.target.value, color: myColor }); e.target.value = "";
        }
    };

    db.ref('global_chat').limitToLast(30).on('child_added', s => {
        const d = s.val(); const m = document.createElement('div'); m.className = 'msg';
        m.innerHTML = `<div class="ava" style="background:${d.color || '#5865f2'}">${d.u.charAt(0)}</div><div><span class="m-u ${d.u==='CREATIV'?'admin':''}">${d.u}:</span><span style="color:#dcddde">${d.t}</span></div>`;
        document.getElementById('msgs').appendChild(m);
        document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
        if (d.u !== myName) icqSound.play().catch(()=>{});
    });
</script>
</body>
</html>
