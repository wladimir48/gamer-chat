<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat v51.3 PRO — Real Voice Call</title>
    
    <!-- ЗАГРУЗКА БИБЛИОТЕК (С ЗАЩИТОЙ ) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --bg-servers: #1e1f22; --accent: #5865f2; --green: #23a559; --text: #dbdee1; }
        body { background: var(--bg-servers); color: var(--text); font-family: sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .col-channels { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        .col-chat { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; min-width: 0; }
        .v-u-card { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin: 5px 10px; border: 2px solid transparent; }
        .speaking { border-color: var(--green) !important; box-shadow: 0 0 12px var(--green); }
        .vol-bar { width: 100%; height: 8px; background: #111; border-radius: 4px; margin-top: 5px; overflow: hidden; }
        .vol-fill { width: 0%; height: 100%; background: var(--green); transition: 0.05s; }
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; display: none; align-items: center; justify-content: center; }
        .m-content { background: var(--bg-main); padding: 25px; border-radius: 12px; width: 320px; display: flex; flex-direction: column; gap: 15px; }
        #mic-test-bar { height: 12px; background: var(--green); width: 0%; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; }
        .ui-input { width: 100%; padding: 12px; background: #383a40; color: white; border: none; border-radius: 8px; outline: none; box-sizing: border-box; }
    </style>
</head>
<body onclick="window.initAudio()">

<div id="modal">
    <div class="m-content">
        <h3 style="margin:0; text-align:center">⚙️ НАСТРОЙКИ ГОЛОСА</h3>
        <input type="text" id="set-nick" style="padding:10px; background:#1e1f22; color:white; border:none; border-radius:4px;">
        <div style="background:#111; height:12px;"><div id="mic-test-bar"></div></div>
        <select id="mic-list" style="padding:10px; background:#1e1f22; color:white; border:none; width:100%"></select>
        <button class="btn" onclick="window.saveSettings()">СОХРАНИТЬ</button>
        <button class="btn" style="background:#4f545c" onclick="window.closeSettings()">ЗАКРЫТЬ</button>
    </div>
</div>

<div class="col-channels">
    <div style="padding:15px; font-weight:bold; border-bottom:1px solid #222">GamerChat v51.3</div>
    <div id="v-users" style="flex:1; overflow-y:auto"></div>
    <div style="padding:10px"><button id="btn-toggle" class="btn" onclick="window.joinVoice()">ВОЙТИ В ГОЛОС</button></div>
    <div style="padding:15px; background:#232428; display:flex; justify-content:space-between; align-items:center">
        <span id="display-nick">...</span>
        <span onclick="window.openSettings()" style="cursor:pointer; font-size:20px">⚙️</span>
    </div>
</div>

<div class="col-chat">
    <div id="msgs"></div>
    <div style="padding:20px"><input type="text" id="ui" class="ui-input" placeholder="Написать..."></div>
</div>

<script>
    let myName = localStorage.getItem('chat_nick') || "CREATIV";
    let selectedMic = localStorage.getItem('chat_mic') || 'default';
    let gCtx = null, myStream = null, testStream = null, peer = null;

    const cfg = {
        apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
        databaseURL: "https://gamerchat-7a857-default-rtdb.firebaseio.com",
    };

    window.initAudio = function() {
        if (!gCtx) gCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (gCtx.state === 'suspended') gCtx.resume();
    };

    window.onload = () => {
        if (typeof firebase === 'undefined') return;
        firebase.initializeApp(cfg);
        const db = firebase.database();
        document.getElementById('display-nick').innerText = myName;

        // Инициализация PeerJS (твой ID в сети — твой ник)
        peer = new Peer(myName.toLowerCase());

        // Принимаем входящий звонок
        peer.on('call', (call) => {
            window.initAudio();
            call.answer(myStream); // Отвечаем своим голосом
            call.on('stream', (remoteStream) => {
                const callerName = call.peer;
                renderCard(callerName);
                visualize(remoteStream, callerName, true); // true — это чужой звук
            });
        });

        // ЧАТ
        const ui = document.getElementById('ui');
        ui.onkeydown = (e) => { if(e.key === 'Enter' && ui.value.trim()){ db.ref('global_chat').push({u:myName, t:ui.value}); ui.value=""; }};
        db.ref('global_chat').limitToLast(20).on('child_added', s => {
            const d = s.val(); document.getElementById('msgs').innerHTML += `<div><b>${d.u}:</b> ${d.t}</div>`;
            document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
        });

        // Синхронизация: кто в голосе
        db.ref('voice_v12').on('value', s => {
            const data = s.val() || {};
            for(let user in data) { 
                if(user !== myName.toLowerCase() && !document.getElementById('card-'+user)) renderCard(user); 
            }
        });
    };

    window.joinVoice = async function() {
        window.initAudio();
        try {
            const constraints = { audio: { deviceId: selectedMic === 'default' ? undefined : { exact: selectedMic } } };
            myStream = await navigator.mediaDevices.getUserMedia(constraints);
            
            document.getElementById('btn-toggle').innerText = "В ЭФИРЕ";
            document.getElementById('btn-toggle').style.background = "var(--green)";
            
            const myId = myName.toLowerCase();
            firebase.database().ref('voice_v12').child(myId).set({status: 'online'});
            
            renderCard(myId);
            visualize(myStream, myId, false); // false — это наш звук

            // Звоним всем, кто уже в сети
            firebase.database().ref('voice_v12').once('value', (s) => {
                const users = s.val();
                for(let target in users) {
                    if(target !== myId) {
                        const call = peer.call(target, myStream);
                        call.on('stream', (remoteStream) => {
                            renderCard(target);
                            visualize(remoteStream, target, true);
                        });
                    }
                }
            });
            
            new Audio('https://wladimir4k.github.io/gamer-chat/icq.mp3'.replace(//g,'')).play().catch(()=>{});
        } catch (e) { alert("Ошибка микрофона!"); }
    };

    function renderCard(n) {
        if(document.getElementById('card-'+n)) return;
        document.getElementById('v-users').innerHTML += `<div class="v-u-card" id="card-${n}"><div>${n.toUpperCase()}</div><div class="vol-bar"><div class="vol-fill" id="vol-${n}"></div></div></div>`;
    }

    function visualize(stream, n, isRemote) {
        const src = gCtx.createMediaStreamSource(stream);
        const anz = gCtx.createAnalyser(); src.connect(anz);
        
        // ЕСЛИ ЭТО ЧУЖОЙ ЗВУК — ВЫВОДИМ ЕГО В ДИНАМИКИ
        if(isRemote) {
            const audio = new Audio();
            audio.srcObject = stream;
            audio.play();
        }

        const dat = new Uint8Array(anz.frequencyBinCount);
        function loop() {
            const bar = document.getElementById('vol-' + n);
            if(!bar) return;
            anz.getByteFrequencyData(dat);
            let max = 0; for(let i=0; i<dat.length; i++) if(dat[i]>max) max=dat[i];
            let v = (max / 255) * 100;
            bar.style.width = Math.min(100, v * 5) + "%";
            if(v > 5) document.getElementById('card-'+n).classList.add('speaking'); else document.getElementById('card-'+n).classList.remove('speaking');
            requestAnimationFrame(loop);
        } loop();
    }

    window.openSettings = async function() {
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('set-nick').value = myName;
        const devs = await navigator.mediaDevices.enumerateDevices();
        const list = document.getElementById('mic-list'); list.innerHTML = "";
        devs.forEach(d => { if(d.kind==='audioinput') {
            const opt = document.createElement('option');
            opt.value = d.deviceId; opt.text = d.label || 'Микрофон';
            if(d.deviceId === selectedMic) opt.selected = true;
            list.appendChild(opt);
        }});
        startMicTest(selectedMic);
    };

    async function startMicTest(id) {
        if(testStream) testStream.getTracks().forEach(t=>t.stop());
        try {
            testStream = await navigator.mediaDevices.getUserMedia({audio: {deviceId: id==='default'?undefined:{exact:id}}});
            const src = gCtx.createMediaStreamSource(testStream);
            const anz = gCtx.createAnalyser(); src.connect(anz);
            const dat = new Uint8Array(anz.frequencyBinCount);
            function loop() {
                if (document.getElementById('modal').style.display === 'none') return;
                anz.getByteFrequencyData(dat);
                let max = 0; for(let i=0; i<dat.length; i++) if(dat[i]>max) max=dat[i];
                document.getElementById('mic-test-bar').style.width = Math.min(100, (max / 255) * 450) + "%";
                requestAnimationFrame(loop);
            } loop();
        } catch(e) {}
    }
    window.saveSettings = function() {
        localStorage.setItem('chat_nick', document.getElementById('set-nick').value);
        localStorage.setItem('chat_mic', document.getElementById('mic-list').value);
        location.reload();
    };
    window.closeSettings = function() { document.getElementById('modal').style.display = 'none'; };
</script>
</body>
</html>
