
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerChat - Discord Style</title>
    <!-- Подключаем Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #1e1f22; color: #dbdee1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        
        /* Боковая панель серверов */
        .servers { width: 72px; background-color: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 12px; border-right: 1px solid #2b2d31; flex-shrink: 0; }
        .icon { width: 48px; height: 48px; background-color: #5865f2; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 8px; text-decoration: none; }
        .icon:hover { border-radius: 30%; background-color: #4752c4; }
        .icon.voice { background-color: #23a559; }

        /* Основная область чата */
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #313338; }
        
        /* Статус бар */
        .status { text-align: center; color: #23a559; padding: 5px; font-size: 0.75rem; font-weight: bold; background: #2b2d31; letter-spacing: 0.5px; }

        /* Список сообщений */
        #msgs { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        #msgs::-webkit-scrollbar { width: 8px; }
        #msgs::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }

        /* Стиль сообщения */
        .msg { margin-bottom: 16px; background: rgba(79, 84, 92, 0.16); padding: 12px; border-radius: 8px; border-left: 4px solid #5865f2; position: relative; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .author { color: #fff; font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .author span small { color: #949ba4; font-size: 0.7em; margin-left: 10px; font-weight: normal; }
        
        .del-btn { color: #f23f43; cursor: pointer; font-size: 1.2em; line-height: 1; opacity: 0.6; transition: 0.2s; }
        .del-btn:hover { opacity: 1; transform: scale(1.2); }

        /* Поле ввода */
        .input-box { padding: 20px; background-color: #313338; }
        input { width: 100%; background: #383a40; border: none; border-radius: 8px; padding: 14px; color: white; outline: none; box-sizing: border-box; font-size: 1rem; }
        input::placeholder { color: #949ba4; }
    </style>
</head>
<body>

    <div class="servers">
        <div class="icon" onclick="location.reload()" title="Обновить чат">G</div>
        <div class="icon voice" onclick="window.open('https://jit.si', '_blank')" title="Голосовой канал">🎤</div>
    </div>

    <div class="chat-area">
        <div id="st" class="status">ПОДКЛЮЧЕНИЕ...</div>
        <div id="msgs"></div>
        <div class="input-box">
            <input type="text" id="ui" placeholder="Написать в #global_chat..." autocomplete="off">
        </div>
    </div>

<script>
    // ТВОИ НАСТРОЙКИ FIREBASE
    const cfg = {
        apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
        authDomain: "gamerchat-7a857.firebaseapp.com",
        databaseURL: "https://gamerchat-7a857-default-rtdb.firebaseio.com",
        projectId: "gamerchat-7a857",
        storageBucket: "gamerchat-7a857.firebasestorage.app",
        messagingSenderId: "899769524812",
        appId: "1:899769524812:web:87609f2f41e3ab93084ae9"
    };

    // Звук уведомления (Discord style)
    const notifySound = new Audio('https://githubusercontent.com');

    if (typeof firebase !== 'undefined') {
        firebase.initializeApp(cfg);
        const db = firebase.database();

        // 1. ПРОВЕРКА НИКА
        let myName = localStorage.getItem('chat_nick');
        if (!myName) {
            myName = prompt("Введи свой никнейм:", "Геймер") || "Аноним";
            localStorage.setItem('chat_nick', myName);
        }

        // 2. СТАТУС СОЕДИНЕНИЯ
        db.ref('.info/connected').on('value', s => {
            const statusEl = document.getElementById('st');
            statusEl.innerText = s.val() ? "В СЕТИ" : "ПОДКЛЮЧЕНИЕ...";
            statusEl.style.color = s.val() ? "#23a559" : "#f23f43";
        });

        // 3. ОТПРАВКА СООБЩЕНИЯ
        const input = document.getElementById('ui');
        input.onkeypress = function(e) {
            if (e.key === 'Enter' && this.value.trim() !== "") {
                const now = new Date();
                const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                db.ref('global_chat').push().set({ 
                    u: myName, 
                    t: this.value,
                    time: timeStr 
                });
                this.value = "";
            }
        };

        // 4. ПОЛУЧЕНИЕ СООБЩЕНИЙ
        db.ref('global_chat').limitToLast(50).on('child_added', s => {
            const d = s.val();
            const key = s.key;
            const msgsContainer = document.getElementById('msgs');
            
            const m = document.createElement('div');
            m.className = 'msg';
            m.id = 'msg-' + key;

            // Стиль для админа
            if (d.u === "CREATIV") {
                m.style.borderLeft = "4px solid #ffca28";
                m.style.background = "rgba(255, 202, 40, 0.1)";
            }

            // Кнопка удаления (только для своих или для админа)
            let delBtn = (d.u === myName || myName === "CREATIV") 
                ? `<span class="del-btn" onclick="deleteMsg('${key}')" title="Удалить">×</span>` 
                : "";

            m.innerHTML = `
                <div class="author" ${d.u === "CREATIV" ? 'style="color:#ffca28"' : ''}>
                    <span>${d.u} <small>${d.time || ''}</small></span>
                    ${delBtn}
                </div>
                <div>${d.t}</div>
            `;
            
            msgsContainer.appendChild(m);
            msgsContainer.scrollTop = msgsContainer.scrollHeight;

            // Звук если сообщение чужое
            if (d.u !== myName) {
                notifySound.play().catch(() => {});
            }
        });

        // 5. УДАЛЕНИЕ СООБЩЕНИЙ В РЕАЛЬНОМ ВРЕМЕНИ
        db.ref('global_chat').on('child_removed', s => {
            const m = document.getElementById('msg-' + s.key);
            if (m) m.remove();
        });

        // Глобальная функция удаления
        window.deleteMsg = function(key) {
            if(confirm("Удалить это сообщение?")) {
                db.ref('global_chat').child(key).remove();
            }
        };
    } else {
        alert("Ошибка: Firebase не загружен!");
    }
</script>
</body>
</html>
