<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat PRO v2.5 (Voice Fix)</title>
    <script src="http://192.168.0.101:3000/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --bg-servers: #1e1f22; --accent: #5865f2; --green: #23a559; --text: #dbdee1; }
        body { background: var(--bg-servers); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .col-channels { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        .col-chat { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; min-width: 0; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; }
        .u-avatar { width: 32px; height: 32px; background: #4e5058; border-radius: 50%; position: relative; border: 2px solid transparent; }
        .speaking { border-color: var(--green) !important; box-shadow: 0 0 8px var(--green); }
        .input-area { padding: 20px; }
        #ui { width: 100%; padding: 12px; background: #383a40; border: none; border-radius: 8px; color: white; outline: none; }
        .v-user { padding: 5px 15px; color: #949ba4; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body onclick="initAudio()">

<div class="col-channels">
    <div style="padding:15px; font-weight:bold; border-bottom:1px solid #222">GamerChat v2.5</div>
    <div style="flex:1; padding-top:15px">
        <div id="voice-btn" onclick="toggleVoice()" style="cursor:pointer; padding:10px 15px; color:#949ba4">🔈 Войти в Голос</div>
        <div id="voice-list"></div>
    </div>
    <div style="padding:15px; background:#232428; display:flex; justify-content:space-between">
        <span id="my-nick-display">...</span>
    </div>
</div>

<div class="col-chat">
    <div id="msgs"></div>
    <div class="input-area"><input type="text" id="ui" placeholder="Написать сообщение..."></div>
</div>

<script>
    "use strict";
    const socket = io('http://192.168.0.101:3000');
    let myName = localStorage.getItem('chat_nick') || "User" + Math.floor(Math.random()*99);
    let gCtx = null, myStream = null, peer = null, isInVoice = false;

    document.getElementById('my-nick-display').innerText = myName;

    function initAudio() {
        if (!gCtx) gCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (gCtx.state === 'suspended') gCtx.resume();
    }

    // ГОЛОСОВОЙ ДВИЖОК (PEERJS ВНУТРИ БРАУЗЕРА)
    peer = new Peer(myName.toLowerCase(), {
        host: '0.peerjs.com', port: 443, secure: true, path: '/'
    });

    peer.on('call', (call) => {
        initAudio();
        call.answer(myStream);
        call.on('stream', (remoteStream) => {
            const audio = document.createElement('audio');
            audio.srcObject = remoteStream;
            audio.autoplay = true;
            document.body.appendChild(audio);
        });
    });

    async function toggleVoice() {
        if (!isInVoice) {
            try {
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                isInVoice = true;
                document.getElementById('voice-btn').style.color = 'var(--green)';
                document.getElementById('voice-btn').innerText = "🔊 В ЭФИРЕ";
                
                socket.emit('user join', { name: myName, inVoice: true });

                // Звоним всем, кто уже в канале
                socket.emit('get voice users');
            } catch(e) { alert("Включи микрофон!"); }
        } else {
            location.reload(); // Простой способ выйти и сбросить всё
        }
    }

    socket.on('call users', (users) => {
        for (let id in users) {
            if (users[id].name.toLowerCase() !== myName.toLowerCase()) {
                const call = peer.call(users[id].name.toLowerCase(), myStream);
                call.on('stream', (rem) => {
                    const audio = document.createElement('audio');
                    audio.srcObject = rem; audio.autoplay = true;
                    document.body.appendChild(audio);
                });
            }
        }
    });

    // ЧАТ И СПИСКИ
    const ui = document.getElementById('ui');
    ui.onkeydown = (e) => {
        if(e.key === 'Enter' && ui.value.trim()){
            socket.emit('chat message', { u: myName, t: ui.value });
            ui.value = "";
        }
    };

    socket.on('chat message', d => {
        document.getElementById('msgs').insertAdjacentHTML('beforeend', `<div><b>${d.u}:</b> ${d.t}</div>`);
        document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
    });

    socket.on('update users', (users) => {
        const vList = document.getElementById('voice-list');
        vList.innerHTML = "";
        for(let id in users){
            if(users[id].inVoice){
                vList.insertAdjacentHTML('beforeend', `<div class="v-user">● ${users[id].name}</div>`);
            }
        }
    });
</script>
</body>
</html>
