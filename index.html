<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat v51.0 PRO</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --bg-servers: #1e1f22; --accent: #5865f2; --green: #23a559; --red: #ed4245; --text: #dbdee1; }
        body { background: var(--bg-servers); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .col-servers { width: 72px; background: var(--bg-servers); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; flex-shrink: 0; }
        .col-channels { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        .col-chat { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; position: relative; min-width: 0; }
        .col-users { width: 200px; background: var(--bg-sidebar); padding: 10px; border-left: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }
        .srv-icon { width: 48px; height: 48px; background: var(--bg-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 20px; font-weight: bold; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; font-size: 15px; }
        .v-u-card { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin: 5px 15px; border: 2px solid transparent; transition: 0.2s; }
        .speaking { border-color: var(--green) !important; box-shadow: 0 0 10px var(--green); }
        .vol-bar { width: 100%; height: 6px; background: #111; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .vol-fill { width: 0%; height: 100%; background: var(--green); transition: 0.05s; }
        .user-panel { background: #232428; padding: 10px; display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .m-content { background: var(--bg-main); padding: 25px; border-radius: 12px; width: 320px; display: flex; flex-direction: column; gap: 15px; }
        #mic-test-bar { height: 12px; background: #00ff00; width: 0%; border-radius: 6px; box-shadow: 0 0 15px #00ff00; transition: 0.05s; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; }
        .input-wrap { background: #383a40; border-radius: 8px; padding: 12px; margin: 15px; }
        #ui { background: transparent; border: none; color: white; width: 100%; outline: none; }
    </style>
</head>
<body onclick="initAudio()">
<div id="audio-storage" style="display:none"></div>
<div id="modal">
    <div class="m-content">
        <h3 style="margin:0">Настройки PRO</h3>
        <label>Ник:</label><input type="text" id="set-nick" style="background:#1e1f22; color:white; border:none; padding:10px; border-radius:6px;">
        <label>Индикатор (Макс. усиление):</label>
        <div style="background:#111; height:12px; border-radius:6px; overflow:hidden;"><div id="mic-test-bar"></div></div>
        <label>Микрофон:</label><select id="mic-list" style="background:#1e1f22; color:white; padding:8px; border:none; width:100%"></select>
        <button class="btn" onclick="saveSettings()">СОХРАНИТЬ</button>
        <button class="btn" style="background:#4e5058" onclick="closeSettings()">ЗАКРЫТЬ</button>
    </div>
</div>
<div class="col-servers"><div class="srv-icon">G</div></div>
<div class="col-channels">
    <div style="padding:15px; font-weight:bold; border-bottom:1px solid #111">GamerChat v51</div>
    <div id="v-users" style="flex:1; overflow-y:auto; padding-top:10px;"></div>
    <div style="padding: 15px;">
        <button id="btn-toggle" class="btn" onclick="joinVoice()">Войти в голос</button>
        <button id="btn-leave" class="btn" style="background:var(--red); display:none" onclick="location.reload()">Выйти</button>
    </div>
    <div class="user-panel">
        <div id="display-nick" style="font-weight:bold">Геймер</div>
        <div onclick="openSettings()" style="cursor:pointer; font-size:18px">⚙️</div>
    </div>
</div>
<div class="col-chat">
    <div id="msgs"></div>
    <div class="input-wrap"><input type="text" id="ui" placeholder="Написать..." autocomplete="off"></div>
</div>
<div class="col-users" id="right-list"></div>

<script>
    let myName = localStorage.getItem('chat_nick') || "CREATIV";
    let selectedMic = localStorage.getItem('chat_mic') || 'default';
    let gCtx = null, myStream = null, testStream = null;
    const myPeerId = 'id-' + Math.random().toString(36).substr(2, 9);

    const cfg = {
        apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
        authDomain: "gamerchat-7a857.firebaseapp.com",
        databaseURL: "https://gamerchat-7a857-default-rtdb.firebaseio.com",
        projectId: "gamerchat-7a857",
        storageBucket: "gamerchat-7a857.firebasestorage.app",
        messagingSenderId: "899769524812",
        appId: "1:899769524812:web:87609f2f41e3ab93084ae9"
    };

    firebase.initializeApp(cfg);
    const db = firebase.database();

    function initAudio() { 
        if(!gCtx) {
            gCtx = new (window.AudioContext || window.webkitAudioContext)();
            console.log("Звук активирован");
        }
        if(gCtx.state === 'suspended') gCtx.resume();
    }

    window.onload = () => {
        document.getElementById('display-nick').innerText = myName;
        const ui = document.getElementById('ui');
        ui.onkeydown = (e) => { if (e.key === 'Enter' && ui.value.trim()) { db.ref('global_chat').push().set({ u: myName, t: ui.value }); ui.value = ""; } };
        db.ref('global_chat').limitToLast(30).on('child_added', s => {
            const d = s.val(); document.getElementById('msgs').innerHTML += `<div><b>${d.u}:</b> ${d.t}</div>`;
            document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
        });
        db.ref('presence').on('value', s => {
            document.getElementById('right-list').innerHTML = "<b>В СЕТИ:</b><br>";
            s.forEach(c => { document.getElementById('right-list').innerHTML += `<div>● ${c.key}</div>`; });
        });
        db.ref('presence').child(myName).set('online');
    };

    async function openSettings() {
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('set-nick').value = myName;
        initAudio();
        
        const devs = await navigator.mediaDevices.enumerateDevices();
        const list = document.getElementById('mic-list'); list.innerHTML = "";
        
        devs.forEach(d => { if(d.kind==='audioinput') {
            const opt = document.createElement('option');
            opt.value = d.deviceId; opt.text = d.label || 'Микрофон';
            if(d.deviceId === selectedMic) opt.selected = true;
            list.appendChild(opt);
        }});

        list.onchange = () => {
            selectedMic = list.value;
            startMicTest(selectedMic);
        };
        startMicTest(selectedMic);
    }

    async function startMicTest(id) {
        if(testStream) testStream.getTracks().forEach(t=>t.stop());
        try {
            const constraints = { audio: { deviceId: id === 'default' ? undefined : { exact: id } } };
            testStream = await navigator.mediaDevices.getUserMedia(constraints);
            if(gCtx.state === 'suspended') await gCtx.resume();
            
            const src = gCtx.createMediaStreamSource(testStream);
            const anz = gCtx.createAnalyser(); 
            anz.fftSize = 256;
            src.connect(anz);
            
            const dat = new Uint8Array(anz.frequencyBinCount);
            function loop() {
                if (document.getElementById('modal').style.display === 'none') return;
                anz.getByteFrequencyData(dat);
                let max = 0;
                for(let i=0; i<dat.length; i++) if(dat[i] > max) max = dat[i];
                
                // РЕАКЦИЯ: Множитель 45 для экстремальной чувствительности
                document.getElementById('mic-test-bar').style.width = Math.min(100, (max / 255) * 450) + "%";
                requestAnimationFrame(loop);
            } loop();
        } catch(e) { console.error("Микрофон не отвечает"); }
    }

    function saveSettings() {
        localStorage.setItem('chat_nick', document.getElementById('set-nick').value);
        localStorage.setItem('chat_mic', selectedMic);
        document.getElementById('display-nick').innerText = document.getElementById('set-nick').value;
        closeSettings();
    }

    function closeSettings() {
        if(testStream) testStream.getTracks().forEach(t=>t.stop());
        document.getElementById('modal').style.display = 'none';
    }

    async function joinVoice() {
        try {
            initAudio();
            const constraints = { audio: { deviceId: selectedMic === 'default' ? undefined : { exact: selectedMic } } };
            myStream = await navigator.mediaDevices.getUserMedia(constraints);
            document.getElementById('btn-toggle').style.display = 'none';
            document.getElementById('btn-leave').style.display = 'block';
            db.ref('voice_v12').child(myName).set({ id: myPeerId });
            renderUserCard(myName);
            visualize(myStream, myName);
        } catch (e) { alert("Микрофон недоступен!"); }
    }

    function renderUserCard(name) {
        if (document.getElementById('card-' + name)) return;
        document.getElementById('v-users').innerHTML += `<div class="v-u-card" id="card-${name}"><div>${name}</div><div class="vol-bar"><div class="vol-fill" id="vol-${name}"></div></div></div>`;
    }

    function visualize(stream, name) {
        const src = gCtx.createMediaStreamSource(stream), anz = gCtx.createAnalyser(); src.connect(anz);
        const dat = new Uint8Array(anz.frequencyBinCount);
        function loop() {
            const bar = document.getElementById('vol-' + name);
            const card = document.getElementById('card-' + name);
            if (!bar) return;
            anz.getByteFrequencyData(dat);
            let max = 0;
            for(let i=0; i<dat.length; i++) if(dat[i] > max) max = dat[i];
            let v = (max / 255) * 100;
            bar.style.width = Math.min(100, v * 3) + '%';
            if (v > 5) card.classList.add('speaking'); else card.classList.remove('speaking');
            requestAnimationFrame(loop);
        } loop();
    }
</script>
</body>
</html>
