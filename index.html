<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerChat v51.0 PRO</title>
    <script src="https://://gstatic.com"></script>
    <script src="https://://gstatic.com"></script>
    <style>
        :root { 
            --bg-main: #313338; --bg-sidebar: #2b2d31; --bg-servers: #1e1f22; 
            --accent: #5865f2; --green: #23a559; --red: #ed4245; --text: #dbdee1;
        }
        body { background: var(--bg-servers); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }

        /* Три колонки */
        .col-servers { width: 72px; background: var(--bg-servers); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; flex-shrink: 0; }
        .col-channels { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        .col-chat { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; position: relative; min-width: 0; }
        .col-users { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 10px; border-left: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }

        /* Элементы интерфейса */
        .srv-icon { width: 48px; height: 48px; background: var(--bg-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 20px; }
        .srv-icon:hover { border-radius: 15px; background: var(--accent); color: white; }
        
        #msgs { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
        .msg-box { margin-bottom: 10px; word-break: break-word; }
        
        /* Голосовые карточки */
        .v-u-card { background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; margin: 5px 10px; border: 1px solid transparent; transition: 0.3s; font-size: 14px; }
        .speaking { border-color: var(--green); box-shadow: 0 0 10px rgba(35, 165, 89, 0.4); color: white; }
        .vol-bar { width: 100%; height: 3px; background: #111; border-radius: 2px; margin-top: 5px; overflow: hidden; }
        .vol-fill { width: 0%; height: 100%; background: var(--green); transition: 0.1s; }

        /* Панель профиля */
        .user-panel { background: #232428; padding: 8px; display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .p-info { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .u-avatar { width: 32px; height: 32px; background: #4e5058; border-radius: 50%; position: relative; }
        .u-status { width: 10px; height: 10px; border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid #232428; }
        .status-online { background: var(--green); }
        .status-offline { background: #80848e; }

        /* Поле ввода */
        .input-area { padding: 15px; background: var(--bg-main); }
        .input-wrap { background: #383a40; border-radius: 8px; display: flex; align-items: center; padding: 0 15px; }
        #ui { background: transparent; border: none; color: white; padding: 12px 0; width: 100%; outline: none; }

        /* Модалка */
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .m-content { background: var(--bg-main); padding: 25px; border-radius: 12px; width: 320px; display: flex; flex-direction: column; gap: 15px; }
        input, select { background: #1e1f22; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body onclick="if(window.AudioContext && gCtx) gCtx.resume()">

<div id="audio-storage" style="display:none"></div>

<div id="modal">
    <div class="m-content">
        <h3>Настройки</h3>
        <input type="text" id="set-nick" placeholder="Твой ник">
        <label>Микрофон:</label> <select id="mic-list"></select>
        <label>Динамики:</label> <select id="speaker-list"></select>
        <button class="btn" onclick="saveSettings()">СОХРАНИТЬ</button>
        <button class="btn" style="background:#4e5058; margin-top: -5px" onclick="document.getElementById('modal').style.display='none'">ОТМЕНА</button>
    </div>
</div>

<!-- Колонки 1: Серверы -->
<div class="col-servers">
    <div class="srv-icon">G</div>
</div>

<!-- Колонки 2: Сайдбар -->
<div class="col-channels">
    <div style="padding:15px; font-weight:bold; border-bottom:1px solid #111">GamerChat v51</div>
    <div class="cat">Голосовой канал</div>
    <div id="v-users" style="flex:1; overflow-y:auto"></div>
    
    <div style="padding: 10px;">
        <button id="btn-toggle" class="btn" onclick="joinVoice()">Войти в голос</button>
        <button id="btn-leave" class="btn" style="background:var(--red); display:none" onclick="leaveVoice()">Выйти</button>
    </div>

    <!-- Панель профиля -->
    <div class="user-panel">
        <div class="p-info" onclick="toggleStatus()">
            <div class="u-avatar">
                <div class="u-status status-online" id="my-status-dot"></div>
            </div>
            <div id="display-nick" style="font-weight:bold; font-size:14px">Геймер</div>
        </div>
        <div style="cursor:pointer; font-size: 18px;" onclick="openSettings()">⚙️</div>
    </div>
</div>

<!-- Колонки 3: Чат -->
<div class="col-chat">
    <div id="msgs"></div>
    <div class="input-area">
        <div class="input-wrap">
            <input type="text" id="ui" placeholder="Написать сообщение..." autocomplete="off">
            <span style="cursor:pointer">😊</span>
        </div>
    </div>
</div>

<!-- Колонки 4: Участники -->
<div class="col-users">
    <div style="color: #949ba4; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px;">В сети</div>
    <div id="right-user-list"></div>
</div>

<script>
    // ТВОЙ ФАЙРБЕЙЗ КОНФИГ
    const cfg = {
        apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
        authDomain: "://firebaseapp.com",
        databaseURL: "https://://firebaseio.com",
        projectId: "gamerchat-7a857",
        storageBucket: "gamerchat-7a857.firebasestorage.app",
        messagingSenderId: "899769524812",
        appId: "1:899769524812:web:87609f2f41e3ab93084ae9"
    };

    firebase.initializeApp(cfg);
    const db = firebase.database();
    
    let myName = localStorage.getItem('chat_nick') || "Геймер";
    let selectedMic = localStorage.getItem('chat_mic') || 'default';
    let selectedSpk = localStorage.getItem('chat_spk') || 'default';
    let myStatus = 'online';
    let myStream = null, connections = {}, gCtx = null; 
    const myPeerId = 'id-' + Math.random().toString(36).substr(2, 9);
    
    const icqSound = new Audio('icq.mp3');

    document.getElementById('display-nick').innerText = myName;

    window.onload = () => {
        const ui = document.getElementById('ui');
        ui.onkeydown = (e) => {
            if (e.key === 'Enter' && ui.value.trim()) {
                db.ref('global_chat').push().set({ u: myName, t: ui.value });
                ui.value = "";
            }
        };

        // Загрузка чата
        db.ref('global_chat').limitToLast(30).on('child_added', s => {
            const d = s.val();
            const m = document.createElement('div'); m.className = 'msg-box';
            m.innerHTML = `<b>${d.u}:</b> ${d.t}`;
            document.getElementById('msgs').appendChild(m);
            document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
            if (d.u !== myName && myStatus !== 'offline') icqSound.play().catch(()=>{});
        });

        // Список участников справа
        db.ref('voice_v12').on('value', s => {
            const rightList = document.getElementById('right-user-list');
            rightList.innerHTML = "";
            s.forEach(child => {
                const n = child.key;
                rightList.innerHTML += `<div style="padding:5px; font-size:14px">● ${n}</div>`;
            });
        });
    };

    // ГОЛОС
    async function joinVoice() {
        try {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: selectedMic } });
            document.getElementById('btn-toggle').style.display = 'none';
            document.getElementById('btn-leave').style.display = 'block';
            
            db.ref('voice_v12').child(myName).set({ id: myPeerId });
            db.ref('voice_v12').child(myName).onDisconnect().remove();
            
            visualize(myStream, myName);
            startEngine();
        } catch (e) { alert("Микрофон!"); }
    }

    function leaveVoice() {
        if (myStream) myStream.getTracks().forEach(t => t.stop());
        db.ref('voice_v12').child(myName).remove();
        // Просто скрываем кнопки, не перезагружая страницу!
        document.getElementById('btn-toggle').style.display = 'block';
        document.getElementById('btn-leave').style.display = 'none';
        document.getElementById('v-users').innerHTML = "";
        for (let n in connections) { connections[n].close(); delete connections[n]; }
    }

    function startEngine() {
        db.ref('voice_v12').on('value', s => {
            const b = document.getElementById('v-users');
            s.forEach(c => {
                const n = c.key;
                if (!document.getElementById('card-' + n)) {
                    b.innerHTML += `<div class="v-u-card" id="card-${n}"><div>${n}</div><div class="vol-bar"><div class="vol-fill" id="vol-${n}"></div></div></div>`;
                }
                if (n !== myName && !connections[n]) setupRTC(n, c.val().id);
            });
        });

        db.ref('signals_v12').child(myName).on('child_added', async s => {
            const d = s.val();
            if (!connections[d.from]) setupRTC(d.from, d.id);
            const pc = connections[d.from];
            try {
                if (d.type === 'offer') {
                    await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
                    const ans = await pc.createAnswer();
                    await pc.setLocalDescription(ans);
                    db.ref('signals_v12').child(d.from).push({ type: 'answer', answer: ans, from: myName });
                } else if (d.type === 'answer') await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
                else if (d.type === 'ice' && d.ice) await pc.addIceCandidate(new RTCIceCandidate(d.ice));
            } catch (e) {}
            s.ref.remove();
        });
    }

    function setupRTC(target, id) {
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        connections[target] = pc;
        myStream.getTracks().forEach(t => pc.addTrack(t, myStream));
        pc.onicecandidate = e => {
            if (e.candidate) db.ref('signals_v12').child(target).push({ type: 'ice', ice: e.candidate, from: myName });
        };
        pc.ontrack = e => {
            const a = document.createElement('audio'); a.autoplay = true; a.srcObject = e.streams[0];
            if (a.setSinkId) a.setSinkId(selectedSpk);
            document.getElementById('audio-storage').appendChild(a);
            visualize(e.streams[0], target);
        };
        if (myName < target) {
            pc.onnegotiationneeded = async () => {
                const off = await pc.createOffer();
                await pc.setLocalDescription(off);
                db.ref('signals_v12').child(target).push({ type: 'offer', offer: off, from: myName });
            };
        }
    }

    function visualize(stream, name) {
        if (!stream) return;
        if (!gCtx) gCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = gCtx.createMediaStreamSource(stream);
        const anz = gCtx.createAnalyser(); src.connect(anz);
        const dat = new Uint8Array(anz.frequencyBinCount);
        function loop() {
            const bar = document.getElementById('vol-' + name);
            const card = document.getElementById('card-' + name);
            if (!bar) return;
            anz.getByteFrequencyData(dat);
            let v = dat.reduce((a, b) => a + b) / dat.length;
            bar.style.width = Math.min(100, v * 5) + '%';
            if (card) {
                if (v > 5) card.classList.add('speaking');
                else card.classList.remove('speaking');
            }
            requestAnimationFrame(loop);
        }
        loop();
    }

    function toggleStatus() {
        myStatus = (myStatus === 'online') ? 'offline' : 'online';
        document.getElementById('my-status-dot').className = 'u-status ' + (myStatus === 'online' ? 'status-online' : 'status-offline');
    }

    window.openSettings = () => {
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('set-nick').value = myName;
        navigator.mediaDevices.enumerateDevices().then(devs => {
            const mS = document.getElementById('mic-list'); const sS = document.getElementById('speaker-list');
            mS.innerHTML = ""; sS.innerHTML = "";
            devs.forEach(d => {
                const opt = `<option value="${d.deviceId}">${d.label || 'Устройство'}</option>`;
                if (d.kind === 'audioinput') mS.innerHTML += opt;
                if (d.kind === 'audiooutput') sS.innerHTML += opt;
            });
        });
    };

    window.saveSettings = () => {
        localStorage.setItem('chat_nick', document.getElementById('set-nick').value);
        localStorage.setItem('chat_mic', document.getElementById('mic-list').value);
        localStorage.setItem('chat_spk', document.getElementById('speaker-list').value);
        location.reload();
    };
</script>
</body>
</html>
