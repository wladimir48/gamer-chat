<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat v51.0 PRO</title>
    <!-- Подключаем Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --bg-servers: #1e1f22; --accent: #5865f2; --green: #23a559; --red: #ed4245; --text: #dbdee1; }
        body { background: var(--bg-servers); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        
        .col-servers { width: 72px; background: var(--bg-servers); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; flex-shrink: 0; }
        .col-channels { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        .col-chat { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; position: relative; min-width: 0; }
        .col-users { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 10px; border-left: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }
        
        .srv-icon { width: 48px; height: 48px; background: var(--bg-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 20px; font-weight: bold; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; font-size: 15px; }
        .msg-box { margin-bottom: 8px; }

        .v-u-card { background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; margin: 5px 10px; border: 1px solid transparent; }
        .speaking { border-color: var(--green) !important; box-shadow: 0 0 10px var(--green); }
        .vol-bar { width: 100%; height: 4px; background: #111; border-radius: 2px; margin-top: 5px; overflow: hidden; }
        .vol-fill { width: 0%; height: 100%; background: var(--green); }

        .user-panel { background: #232428; padding: 8px; display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .p-info { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .u-avatar { width: 32px; height: 32px; background: #4e5058; border-radius: 50%; position: relative; }
        .u-status { width: 10px; height: 10px; border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid #232428; }
        .status-online { background: var(--green); }

        .input-wrap { background: #383a40; border-radius: 8px; display: flex; align-items: center; padding: 12px 15px; margin: 15px; }
        #ui { background: transparent; border: none; color: white; width: 100%; outline: none; }

        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .m-content { background: var(--bg-main); padding: 25px; border-radius: 12px; width: 320px; display: flex; flex-direction: column; gap: 15px; }
        .mic-test-container { background: #1e1f22; height: 12px; border-radius: 6px; overflow: hidden; }
        #mic-fill { height: 100%; width: 0%; background: var(--green); transition: 0.1s; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body onclick="setupAudioOnce()">

<div id="modal">
    <div class="m-content">
        <h3 style="margin:0">Настройки</h3>
        <label>Твой ник:</label>
        <input type="text" id="set-nick" style="background:#1e1f22; color:white; border:none; padding:10px; border-radius:6px;">
        <label>Тест микрофона:</label>
        <div class="mic-test-container"><div id="mic-fill"></div></div>
        <label>Микрофон:</label>
        <select id="mic-list" style="background:#1e1f22; color:white; padding:8px; border:none;"></select>
        <button class="btn" onclick="saveSettings()">СОХРАНИТЬ</button>
        <button class="btn" style="background:#4e5058" onclick="closeSettings()">ЗАКРЫТЬ</button>
    </div>
</div>

<div class="col-servers"><div class="srv-icon">G</div></div>
<div class="col-channels">
    <div style="padding:15px; font-weight:bold; border-bottom:1px solid #111">GamerChat v51</div>
    <div id="v-users" style="flex:1; overflow-y:auto; padding-top:10px;"></div>
    <div style="padding: 15px;">
        <button id="btn-toggle" class="btn" onclick="joinVoice()">Войти в голос</button>
        <button id="btn-leave" class="btn" style="background:var(--red); display:none" onclick="location.reload()">Выйти</button>
    </div>
    <div class="user-panel">
        <div class="p-info">
            <div class="u-avatar"><div class="u-status status-online"></div></div>
            <div id="display-nick" style="font-weight:bold; font-size:14px">Геймер</div>
        </div>
        <div onclick="openSettings()" style="cursor:pointer; font-size:18px">⚙️</div>
    </div>
</div>

<div class="col-chat">
    <div id="msgs"></div>
    <div class="input-wrap">
        <input type="text" id="ui" placeholder="Написать сообщение..." autocomplete="off">
    </div>
</div>

<div class="col-users">
    <div style="color: #949ba4; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px;">В сети</div>
    <div id="right-user-list"></div>
</div>

<script>
    // 1. Сначала ОБЪЯВЛЯЕМ переменные
    let myName = localStorage.getItem('chat_nick') || "Геймер";
    let selectedMic = localStorage.getItem('chat_mic') || 'default';
    let gCtx = null;
    let testStream = null;
    let myStream = null;
    const myPeerId = 'id-' + Math.random().toString(36).substr(2, 9);

    // 2. Конфиг Firebase (убедись, что после удаления  адрес начинается с https://)
    const cfg = {
        apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
        authDomain: "gamerchat-7a857.firebaseapp.com",
        databaseURL: "https://gamerchat-7a857-default-rtdb.firebaseio.com",
        projectId: "gamerchat-7a857",
        storageBucket: "gamerchat-7a857.firebasestorage.app",
        messagingSenderId: "899769524812",
        appId: "1:899769524812:web:87609f2f41e3ab93084ae9"
    };

    // 3. Запуск Firebase
    firebase.initializeApp(cfg);
    const db = firebase.database();

    // Функция пробуждения звука
    function setupAudioOnce() {
        if (!gCtx) {
            gCtx = new (window.AudioContext || window.webkitAudioContext)();
            console.log("Звуковой движок запущен");
        }
        if (gCtx.state === 'suspended') gCtx.resume();
    }

    // 4. Основная логика после загрузки окна
    window.onload = () => {
        document.getElementById('display-nick').innerText = myName;
        const ui = document.getElementById('ui');
        
        ui.onkeydown = (e) => { 
            if (e.key === 'Enter' && ui.value.trim()) { 
                db.ref('global_chat').push().set({ u: myName, t: ui.value }); 
                ui.value = ""; 
            } 
        };

        db.ref('global_chat').limitToLast(30).on('child_added', s => {
            const d = s.val();
            const m = document.createElement('div');
            m.className = 'msg-box';
            m.innerHTML = `<b>${d.u}:</b> ${d.t}`;
            document.getElementById('msgs').appendChild(m);
            document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
        });

        db.ref('presence').on('value', s => {
            document.getElementById('right-user-list').innerHTML = "";
            s.forEach(c => { document.getElementById('right-user-list').innerHTML += `<div style="padding:5px">● ${c.key}</div>`; });
        });

        db.ref('presence').child(myName).set('online');
        db.ref('presence').child(myName).onDisconnect().remove();
    };

    // Настройки и индикатор
    async function openSettings() {
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('set-nick').value = myName;
        setupAudioOnce();

        try {
            const devs = await navigator.mediaDevices.enumerateDevices();
            const list = document.getElementById('mic-list'); 
            list.innerHTML = "";
            devs.forEach(d => { 
                if(d.kind==='audioinput') {
                    let opt = document.createElement('option');
                    opt.value = d.deviceId;
                    opt.text = d.label || 'Микрофон';
                    if(d.deviceId === selectedMic) opt.selected = true;
                    list.appendChild(opt);
                }
            });

            testStream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: selectedMic } });
            const src = gCtx.createMediaStreamSource(testStream);
            const anz = gCtx.createAnalyser();
            src.connect(anz);
            const dat = new Uint8Array(anz.frequencyBinCount);

            function loop() {
                if (document.getElementById('modal').style.display === 'none') return;
                anz.getByteFrequencyData(dat);
                let v = dat.reduce((a,b)=>a+b)/dat.length;
                document.getElementById('mic-fill').style.width = Math.min(100, v * 10) + "%";
                requestAnimationFrame(loop);
            }
            loop();
        } catch (e) { console.error("Микрофон недоступен:", e); }
    }

    function closeSettings() {
        if(testStream) testStream.getTracks().forEach(t=>t.stop());
        document.getElementById('modal').style.display = 'none';
    }

    function saveSettings() {
        localStorage.setItem('chat_nick', document.getElementById('set-nick').value);
        localStorage.setItem('chat_mic', document.getElementById('mic-list').value);
        location.reload();
    }

    async function joinVoice() {
        try {
            setupAudioOnce();
            myStream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: selectedMic } });
            document.getElementById('btn-toggle').style.display = 'none';
            document.getElementById('btn-leave').style.display = 'block';
            db.ref('voice_v12').child(myName).set({ id: myPeerId });
            // Здесь будет мотор WebRTC (Engine) в следующем шаге
            console.log("Вы вошли в голосовой канал!");
        } catch (e) { alert("Разреши микрофон в браузере!"); }
    }
</script>
</body>
</html>
