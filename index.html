<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat v19.0 - VK Engine</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-guilds: #1e1f22; --bg-sidebar: #2b2d31; --bg-chat: #313338;
            --bg-input: #383a40; --text-main: #dbdee1; --text-muted: #949ba4;
            --accent: #5865f2; --admin: #f1c40f;
        }
        body { background: var(--bg-guilds); color: var(--text-main); font-family: sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        
        .guilds { width: 72px; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; flex-shrink: 0; }
        .sidebar { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        .chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); position: relative; }
        .members { width: 240px; background: var(--bg-sidebar); padding: 8px; flex-shrink: 0; border-left: 1px solid rgba(0,0,0,0.1); }

        .g-icon { width: 48px; height: 48px; background: var(--bg-chat); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .g-icon:hover { border-radius: 15px; background: var(--accent); }
        
        .s-header { padding: 12px 16px; font-weight: bold; box-shadow: 0 1px 0 rgba(0,0,0,0.1); color: white; display: flex; justify-content: space-between; align-items: center; }
        
        .c-item { padding: 8px 12px; margin: 2px 8px; border-radius: 4px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; }
        .c-item:hover, .c-item.active { background: #35373c; color: var(--text-main); }

        #msgs { flex: 1; overflow-y: auto; padding: 16px 0; }
        .msg { display: flex; padding: 4px 16px; gap: 16px; margin-bottom: 8px; }
        .m-ava { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; text-transform: uppercase; }
        .m-user { font-weight: bold; color: white; margin-right: 8px; }
        .m-user.admin { color: var(--admin); }
        
        .chat-i { padding: 20px; }
        .input-box { background: var(--bg-input); border-radius: 8px; display: flex; align-items: center; padding: 0 12px; }
        input { flex: 1; background: transparent; border: none; padding: 12px; color: white; outline: none; }
        .emoji-btn { cursor: pointer; font-size: 20px; opacity: 0.7; }

        #emoji-picker { 
            position: absolute; bottom: 80px; left: 20px; background: #232428; 
            border: 1px solid #111; border-radius: 8px; display: none; 
            grid-template-columns: repeat(5, 1fr); padding: 8px; gap: 4px; z-index: 100;
        }
        .emoji-pick { cursor: pointer; font-size: 22px; padding: 4px; }

        .m-card { display: flex; align-items: center; gap: 10px; padding: 6px; }
        .m-group { font-size: 11px; font-weight: bold; color: var(--text-muted); padding: 12px 8px 4px 8px; }
    </style>
</head>
<body>

<div class="guilds">
    <div class="g-icon" style="background: var(--accent); color: white;" onclick="location.reload()">C</div>
</div>

<div class="sidebar">
    <div class="s-header">Сервер CREATIV ⌄</div>
    <div style="flex:1">
        <div class="m-group">ТЕКСТОВЫЕ КАНАЛЫ</div>
        <div class="c-item active"># основной</div>
        
        <div class="m-group">ГОЛОСОВЫЕ КАНАЛЫ</div>
        <!-- Прямая ссылка на звонок VK Calls -->
        <a href="https://vk.com" target="_blank" class="c-item" id="voice-link">
            <span>🔊</span> Основной
        </a>
    </div>
</div>

<div class="chat">
    <div class="s-header">
        <span># основной</span>
        <span id="conn-st" style="font-size: 10px; color: #f23f43;">ПОДКЛЮЧЕНИЕ...</span>
    </div>
    <div id="msgs"></div>
    <div id="emoji-picker"></div>
    <div class="chat-i">
        <div class="input-box">
            <div class="emoji-btn" onclick="toggleEmojis()">😀</div>
            <input type="text" id="ui" placeholder="Написать в #основной" autocomplete="off">
        </div>
    </div>
</div>

<div class="members">
    <div class="m-group">В СЕТИ</div>
    <div id="member-list"></div>
</div>

<script>
    const cfg = {
        apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
        authDomain: "gamerchat-7a857.firebaseapp.com",
        databaseURL: "https://gamerchat-7a857-default-rtdb.firebaseio.com",
        projectId: "gamerchat-7a857",
        storageBucket: "gamerchat-7a857.firebasestorage.app",
        messagingSenderId: "899769524812",
        appId: "1:899769524812:web:87609f2f41e3ab93084ae9"
    };

    firebase.initializeApp(cfg);
    const db = firebase.database();
    
    let myName = localStorage.getItem('chat_nick');
    if (!myName) {
        myName = prompt("Введи свой ник:") || "Геймер";
        localStorage.setItem('chat_nick', myName);
    }

    // Проверка связи с Firebase
    db.ref('.info/connected').on('value', s => {
        document.getElementById('conn-st').innerText = s.val() ? "ОНЛАЙН" : "ОФФЛАЙН";
        document.getElementById('conn-st').style.color = s.val() ? "#23a559" : "#f23f43";
    });

    // Список участников
    const presenceRef = db.ref('presence/' + myName);
    presenceRef.set({ name: myName }).onDisconnect().remove();
    db.ref('presence').on('value', s => {
        const list = document.getElementById('member-list'); list.innerHTML = "";
        s.forEach(c => {
            const u = c.val(); const isAdmin = (u.name === "CREATIV");
            list.innerHTML += `<div class="m-card"><div class="m-ava" style="width:32px; height:32px; font-size:14px; background:${isAdmin?'#f1c40f':''}">${u.name.charAt(0).toUpperCase()}</div><div style="font-weight:bold; color:${isAdmin?'#f1c40f':''}">${u.name} ${isAdmin?'👑':''}</div></div>`;
        });
    });

    // Отправка сообщений (исправленный метод)
    const ui = document.getElementById('ui');
    ui.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && ui.value.trim() !== "") {
            const msgData = {
                u: myName,
                t: ui.value,
                time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
            };
            db.ref('global_chat').push().set(msgData);
            ui.value = "";
            picker.style.display = 'none';
        }
    });

    // Загрузка сообщений
    db.ref('global_chat').limitToLast(50).on('child_added', s => {
        const d = s.val(); const isAdmin = (d.u === "CREATIV");
        const m = document.createElement('div'); m.className = 'msg';
        m.innerHTML = `<div class="m-ava" style="background:${isAdmin?'#f1c40f':''}">${d.u.charAt(0).toUpperCase()}</div><div><span class="m-user ${isAdmin?'admin':''}">${d.u}</span><span style="font-size:12px;color:var(--text-muted)">${d.time||''}</span><div style="margin-top:2px">${d.t}</div></div>`;
        document.getElementById('msgs').appendChild(m);
        document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
    });

    // Эмодзи
    const emojis = ["😀","😂","😊","😍","😎","🤔","👍","🔥","✨","🎉","👋","😭","😱","😡","💀","💩","❤️","✅","❌","🎮"];
    const picker = document.getElementById('emoji-picker');
    emojis.forEach(e => {
        const span = document.createElement('span'); span.className = 'emoji-pick'; span.innerText = e;
        span.onclick = () => { ui.value += e; picker.style.display = 'none'; ui.focus(); };
        picker.appendChild(span);
    });
    function toggleEmojis() { picker.style.display = (picker.style.display === 'grid') ? 'none' : 'grid'; }
</script>
</body>
</html>
