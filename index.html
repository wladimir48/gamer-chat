<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat PRO v57.0 — UNIVERSAL</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --accent: #5865f2; --green: #23a559; --text: #dbdee1; }
        body { background: #1e1f22; color: var(--text); font-family: sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .col-chat { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; }
        .input-area { padding: 20px; }
        #ui { width: 100%; padding: 10px; background: #383a40; border: none; border-radius: 5px; color: white; }
        .u-list { width: 200px; background: #2b2d31; padding: 15px; border-left: 1px solid #111; }
    </style>
</head>
<body onclick="if(window.gCtx) gCtx.resume()">

<div style="width: 240px; background: #2b2d31; padding: 15px;">
    <h3 id="my-nick">...</h3>
    <button onclick="toggleVoice()" id="v-btn" style="background:var(--accent); color:white; border:none; padding:10px; width:100%; cursor:pointer">ВОЙТИ В ГОЛОС</button>
    <div id="v-list" style="margin-top:20px"></div>
</div>

<div class="col-chat">
    <div id="msgs"></div>
    <div class="input-area"><input type="text" id="ui" placeholder="Напиши что-нибудь..."></div>
</div>

<div class="u-list" id="u-list"></div>

<script>
    "use strict";
    // МАГИЯ: Авто-настройка под любой туннель
    const socket = io(window.location.origin, { transports: ['polling'] });
    
    let myName = localStorage.getItem('chat_nick') || "Игрок" + Math.floor(Math.random()*1000);
    let gCtx = new (window.AudioContext || window.webkitAudioContext)();
    let peer = null, myStream = null, isInVoice = false;

    window.onload = () => {
        document.getElementById('my-nick').innerText = myName;
        socket.emit('user join', { name: myName, inVoice: false });
        setupPeer();
    };

    async function setupPeer() {
        // Настройка под текущий адрес сайта
        peer = new Peer(undefined, {
            host: window.location.hostname,
            port: window.location.port || (window.location.protocol === 'https:' ? 443 : 80),
            path: '/peerjs',
            secure: window.location.protocol === 'https:',
            config: { 'iceServers': [{ 'urls': 'stun:://google.com' }] }
        });

        peer.on('open', id => {
            socket.emit('user join', { name: myName, inVoice: isInVoice, pID: id });
        });

        peer.on('call', call => {
            call.answer(myStream);
            call.on('stream', rem => {
                const a = document.createElement('audio'); a.srcObject = rem; a.autoplay = true; document.body.appendChild(a);
            });
        });
    }

    socket.on('update users', users => {
        const vL = document.getElementById('v-list'), uL = document.getElementById('u-list');
        vL.innerHTML = ""; uL.innerHTML = "";
        for(let id in users) {
            uL.insertAdjacentHTML('beforeend', `<div>● ${users[id].name}</div>`);
            if(users[id].inVoice) {
                vL.insertAdjacentHTML('beforeend', `<div>🎤 ${users[id].name} <div id="mic-v-${id}" style="height:4px; background:var(--green); width:0%"></div></div>`);
                if(isInVoice && users[id].pID && id !== socket.id) {
                    const call = peer.call(users[id].pID, myStream);
                    call.on('stream', rem => {
                        const a = document.createElement('audio'); a.srcObject = rem; a.autoplay = true; document.body.appendChild(a);
                    });
                }
            }
        }
    });

    async function toggleVoice() {
        if (!isInVoice) {
            myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            isInVoice = true;
            document.getElementById('v-btn').style.background = 'var(--green)';
            socket.emit('user join', { name: myName, inVoice: true, pID: peer.id });
            
            const src = gCtx.createMediaStreamSource(myStream), anz = gCtx.createAnalyser();
            src.connect(anz); const dat = new Uint8Array(anz.frequencyBinCount);
            function loop() {
                if(!isInVoice) return;
                anz.getByteFrequencyData(dat);
                let vol = (Math.max(...dat) / 255) * 100;
                const fill = document.getElementById('mic-v-' + socket.id);
                if(fill) fill.style.width = vol + "%";
                requestAnimationFrame(loop);
            } loop();
        } else { location.reload(); }
    }

    socket.on('chat message', d => {
        document.getElementById('msgs').insertAdjacentHTML('beforeend', `<div><b>${d.u}:</b> ${d.t}</div>`);
    });

    document.getElementById('ui').onkeydown = (e) => {
        if(e.key === 'Enter' && e.target.value.trim()){
            socket.emit('chat message', { u: myName, t: e.target.value });
            e.target.value = "";
        }
    };
</script>
</body>
</html>
