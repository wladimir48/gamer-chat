<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GamerChat v51.0 PRO</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --bg-main: #313338; --bg-sidebar: #2b2d31; --bg-servers: #1e1f22; --accent: #5865f2; --green: #23a559; --red: #ed4245; --text: #dbdee1; }
        body { background: var(--bg-servers); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        .col-servers { width: 72px; background: var(--bg-servers); display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; flex-shrink: 0; }
        .col-channels { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        .col-chat { flex: 1; background: var(--bg-main); display: flex; flex-direction: column; position: relative; min-width: 0; }
        .col-users { width: 240px; background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 10px; border-left: 1px solid rgba(0,0,0,0.2); flex-shrink: 0; }
        .srv-icon { width: 48px; height: 48px; background: var(--bg-main); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 20px; }
        #msgs { flex: 1; overflow-y: auto; padding: 20px; scroll-behavior: smooth; }
        .msg-box { margin-bottom: 10px; word-break: break-word; }
        .user-panel { background: #232428; padding: 8px; display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .p-info { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .u-avatar { width: 32px; height: 32px; background: #4e5058; border-radius: 50%; position: relative; }
        .u-status { width: 10px; height: 10px; border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid #232428; }
        .status-online { background: var(--green); }
        .status-offline { background: #80848e; }
        .input-wrap { background: #383a40; border-radius: 8px; display: flex; align-items: center; padding: 15px; margin: 15px; }
        #ui { background: transparent; border: none; color: white; width: 100%; outline: none; }
        #modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .m-content { background: var(--bg-main); padding: 25px; border-radius: 12px; width: 320px; display: flex; flex-direction: column; gap: 15px; }
        .mic-test-bar { background: #1e1f22; height: 10px; border-radius: 5px; overflow: hidden; }
        #mic-fill { height: 100%; width: 0%; background: var(--green); transition: 0.05s; }
        .em-panel { display: none; position: absolute; bottom: 70px; right: 20px; background: #2b2d31; padding: 15px; border-radius: 12px; grid-template-columns: repeat(5, 1fr); gap: 10px; z-index: 100; }
        .em-panel.active { display: grid; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
<div id="audio-storage" style="display:none"></div>
<div id="modal">
    <div class="m-content">
        <h3>Настройки</h3>
        <input type="text" id="set-nick" placeholder="Твой ник">
        <label>Индикатор микрофона:</label>
        <div class="mic-test-bar"><div id="mic-fill"></div></div>
        <label>Выбор микрофона:</label> <select id="mic-list" style="background:#1e1f22; color:white; padding:5px;"></select>
        <button class="btn" onclick="saveSettings()">СОХРАНИТЬ</button>
        <button class="btn" style="background:#4e5058" onclick="closeSettings()">ОТМЕНА</button>
    </div>
</div>
<div class="col-servers"><div class="srv-icon">G</div></div>
<div class="col-channels">
    <div style="padding:15px; font-weight:bold; border-bottom:1px solid #111">GamerChat v51</div>
    <div style="flex:1"></div>
    <div style="padding: 10px;">
        <button id="btn-toggle" class="btn" onclick="joinVoice()">Войти в голос</button>
        <button id="btn-leave" class="btn" style="background:var(--red); display:none" onclick="leaveVoice()">Выйти</button>
    </div>
    <div class="user-panel">
        <div class="p-info" onclick="toggleStatus()">
            <div class="u-avatar"><div class="u-status status-online" id="my-status-dot"></div></div>
            <div id="display-nick" style="font-weight:bold; font-size:14px">Геймер</div>
        </div>
        <div style="cursor:pointer; font-size: 18px;" onclick="openSettings()">⚙️</div>
    </div>
</div>
<div class="col-chat">
    <div id="msgs"></div>
    <div class="input-wrap">
        <div class="em-panel" id="em-box"></div>
        <input type="text" id="ui" placeholder="Написать сообщение..." autocomplete="off">
        <span style="cursor:pointer" onclick="document.getElementById('em-box').classList.toggle('active')">😊</span>
    </div>
</div>
<div class="col-users">
    <div style="color: #949ba4; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px;">В сети</div>
    <div id="right-user-list"></div>
</div>
<script>
    const cfg = {
        apiKey: "AIzaSyBax3Y3NEkOnGFVnJbnN1kgh9QFHrEt-7U",
        authDomain: "gamerchat-7a857.firebaseapp.com",
        databaseURL: "https://gamerchat-7a857-default-rtdb.firebaseio.com",
        projectId: "gamerchat-7a857",
        storageBucket: "gamerchat-7a857.firebasestorage.app",
        messagingSenderId: "899769524812",
        appId: "1:899769524812:web:87609f2f41e3ab93084ae9"
    };
    firebase.initializeApp(cfg); const db = firebase.database();
    let myName = localStorage.getItem('chat_nick') || "Геймер";
    let selectedMic = localStorage.getItem('chat_mic') || 'default';
    let myStatus = 'online', gCtx = null, testStream = null;
    const icqSound = new Audio('icq.mp3');
    document.getElementById('display-nick').innerText = myName;

    // Смайлы
    const emojis = ['😊','😂','🔥','🎮','💀','👍','❤️','🤡','👾','🤖'];
    const emBox = document.getElementById('em-box');
    emojis.forEach(e => {
        const s = document.createElement('span'); s.innerText = e; s.style.cursor = 'pointer'; s.style.fontSize = '24px';
        s.onclick = () => { document.getElementById('ui').value += e; emBox.classList.remove('active'); document.getElementById('ui').focus(); };
        emBox.appendChild(s);
    });

    window.onload = () => {
        const ui = document.getElementById('ui');
        ui.onkeydown = (e) => { if (e.key === 'Enter' && ui.value.trim()) { db.ref('global_chat').push().set({ u: myName, t: ui.value }); ui.value = ""; } };
        db.ref('global_chat').limitToLast(30).on('child_added', s => {
            const d = s.val(); const m = document.createElement('div'); m.innerHTML = `<b>${d.u}:</b> ${d.t}`;
            document.getElementById('msgs').appendChild(m); document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
            if (d.u !== myName && myStatus !== 'offline') icqSound.play().catch(()=>{});
        });
        db.ref('presence').on('value', s => {
            const list = document.getElementById('right-user-list'); list.innerHTML = "";
            s.forEach(c => { list.innerHTML += `<div style="padding:5px; font-size:14px">● ${c.key} (${c.val()})</div>`; });
        });
        db.ref('presence').child(myName).set(myStatus);
        db.ref('presence').child(myName).onDisconnect().remove();
    };

    async function openSettings() {
        document.getElementById('modal').style.display = 'flex';
        document.getElementById('set-nick').value = myName;
        
        // Магия оживления индикатора
        if (!gCtx) gCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (gCtx.state === 'suspended') await gCtx.resume();

        try {
            const devs = await navigator.mediaDevices.enumerateDevices();
            const mS = document.getElementById('mic-list'); mS.innerHTML = "";
            devs.forEach(d => { if(d.kind==='audioinput') {
                let opt = document.createElement('option'); opt.value = d.deviceId; opt.text = d.label || 'Микрофон';
                if(d.deviceId === selectedMic) opt.selected = true;
                mS.appendChild(opt);
            }});

            testStream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: selectedMic } });
            const src = gCtx.createMediaStreamSource(testStream);
            const anz = gCtx.createAnalyser(); src.connect(anz);
            const dat = new Uint8Array(anz.frequencyBinCount);
            
            function draw() {
                if (document.getElementById('modal').style.display === 'none') {
                    testStream.getTracks().forEach(t => t.stop());
                    return;
                }
                anz.getByteFrequencyData(dat);
                let v = dat.reduce((a,b)=>a+b)/dat.length;
                document.getElementById('mic-fill').style.width = Math.min(100, v * 8) + "%"; // Увеличил чувствительность
                requestAnimationFrame(draw);
            } draw();
        } catch (e) { console.error(e); }
    }

    function closeSettings() { document.getElementById('modal').style.display = 'none'; }
    function saveSettings() {
        myName = document.getElementById('set-nick').value;
        selectedMic = document.getElementById('mic-list').value;
        localStorage.setItem('chat_nick', myName);
        localStorage.setItem('chat_mic', selectedMic);
        document.getElementById('display-nick').innerText = myName;
        closeSettings();
    }

    function toggleStatus() {
        myStatus = (myStatus === 'online') ? 'offline' : 'online';
        document.getElementById('my-status-dot').className = 'u-status ' + (myStatus === 'online' ? 'status-online' : 'status-offline');
        db.ref('presence').child(myName).set(myStatus);
    }
</script>
</body>
</html>
